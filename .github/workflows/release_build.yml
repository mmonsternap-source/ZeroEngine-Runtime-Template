name: ZeroEngine Cloud Build (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Game App Name'
        required: true
        default: 'MyZeroGame'
      package_name:
        description: 'Android Application ID'
        required: true
        default: 'com.developer.myzerogame'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
      build_format:
        description: 'Build Format (apk / aab / both)'
        required: true
        default: 'both'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Runtime Template
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Unpack Uploaded Game Bundle
        run: |
          mkdir -p app/src/main/assets/game
          if [ -f "game_bundle.zip" ]; then
            rm -rf app/src/main/assets/game/*
            unzip -o game_bundle.zip -d app/src/main/assets/game
          fi

      - name: Patch App Name, Package Name & Version
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PKG_NAME: ${{ github.event.inputs.package_name }}
          VER_NAME: ${{ github.event.inputs.version_name }}
          VER_CODE: ${{ github.event.inputs.version_code }}
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          GRADLE_FILE="app/build.gradle"
          [ -f "app/build.gradle.kts" ] && GRADLE_FILE="app/build.gradle.kts"
          sed -i -E "s/(applicationId[[:space:]]*=?[[:space:]]*\")[^\"]+\"/\1${PKG_NAME}\"/" "$GRADLE_FILE"
          sed -i -E "s/(versionCode[[:space:]]*=?[[:space:]]*)[0-9]+/\1${VER_CODE}/" "$GRADLE_FILE"
          sed -i -E "s/(versionName[[:space:]]*=?[[:space:]]*\")[^\"]+\"/\1${VER_NAME}\"/" "$GRADLE_FILE"

      - name: Decode Release Keystore (If Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "HAS_SIGNING=true" >> $GITHUB_ENV
          else
            echo "HAS_SIGNING=false" >> $GITHUB_ENV
          fi

      - name: Build APK & AAB
        env:
          FMT: ${{ github.event.inputs.build_format }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p dist_out

          if [ "$HAS_SIGNING" = "true" ]; then
            SIGN_ARGS="-Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
                       -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                       -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                       -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            if [ "$FMT" = "apk" ] || [ "$FMT" = "both" ]; then
              ./gradlew assembleRelease $SIGN_ARGS
              cp app/build/outputs/apk/release/*.apk dist_out/
            fi
            if [ "$FMT" = "aab" ] || [ "$FMT" = "both" ]; then
              ./gradlew bundleRelease $SIGN_ARGS
              cp app/build/outputs/bundle/release/*.aab dist_out/
            fi
          else
            if [ "$FMT" = "apk" ] || [ "$FMT" = "both" ]; then
              ./gradlew assembleDebug
              cp app/build/outputs/apk/debug/*.apk dist_out/
            fi
            if [ "$FMT" = "aab" ] || [ "$FMT" = "both" ]; then
              ./gradlew bundleDebug
              cp app/build/outputs/bundle/debug/*.aab dist_out/
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroEngine-Game-Build
          path: dist_out/*
          retention-days: 7
