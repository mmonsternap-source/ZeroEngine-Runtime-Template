name: ZeroEngine Cloud Build (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Game App Name'
        required: true
        default: 'MyZeroGame'
      package_name:
        description: 'Android Application ID'
        required: true
        default: 'com.developer.myzerogame'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
      build_format:
        description: 'Build Format (apk / aab / both)'
        required: true
        default: 'both'
      build_type:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
      screen_orientation:
        description: 'Screen Orientation (sensor / landscape / portrait)'
        required: true
        default: 'sensor'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Runtime Template
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Uploaded Game Bundle
        run: |
          mkdir -p app/src/main/assets/game
          if [ -f "game_bundle.zip" ]; then
            rm -rf app/src/main/assets/game/*
            unzip -o game_bundle.zip -d app/src/main/assets/game
          fi

      - name: Patch App Name, Package, Version, Icon & Orientation
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PKG_NAME: ${{ github.event.inputs.package_name }}
          VER_NAME: ${{ github.event.inputs.version_name }}
          VER_CODE: ${{ github.event.inputs.version_code }}
          SCREEN_ORI: ${{ github.event.inputs.screen_orientation }}
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          GRADLE_FILE="app/build.gradle"
          [ -f "app/build.gradle.kts" ] && GRADLE_FILE="app/build.gradle.kts"
          sed -i -E "s/(applicationId[[:space:]]*=?[[:space:]]*\")[^\"]+\"/\1${PKG_NAME}\"/" "$GRADLE_FILE"
          sed -i -E "s/(versionCode[[:space:]]*=?[[:space:]]*)[0-9]+/\1${VER_CODE}/" "$GRADLE_FILE"
          sed -i -E "s/(versionName[[:space:]]*=?[[:space:]]*\")[^\"]+\"/\1${VER_NAME}\"/" "$GRADLE_FILE"

          # 1. 替换自定义桌面图标（若工程包含 app_icon.png）
          HAS_CUSTOM_ICON="0"
          if [ -f "app/src/main/assets/game/app_icon.png" ]; then
            HAS_CUSTOM_ICON="1"
            rm -rf app/src/main/res/mipmap-anydpi-v26
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "app/src/main/res/$d"
              cp app/src/main/assets/game/app_icon.png "app/src/main/res/$d/ic_launcher.png"
              cp app/src/main/assets/game/app_icon.png "app/src/main/res/$d/ic_launcher_round.png"
            done
            rm -f app/src/main/assets/game/app_icon.png
          fi

          # 2. 写入横屏/竖屏锁定配置与图标属性到 AndroidManifest.xml
          HAS_CUSTOM_ICON="$HAS_CUSTOM_ICON" python3 - <<'PY'
          import os, re
          p = "app/src/main/AndroidManifest.xml"
          if os.path.exists(p):
              txt = open(p, encoding="utf-8").read()
              ori = os.environ.get("SCREEN_ORI", "sensor")
              ori_map = {
                  "portrait": "portrait",
                  "landscape": "sensorLandscape",
                  "sensor": "unspecified"
              }
              val = ori_map.get(ori, "unspecified")

              def patch_activity(m):
                  tag = m.group(0)
                  if "android:screenOrientation=" in tag:
                      return re.sub(r'android:screenOrientation="[^"]*"', f'android:screenOrientation="{val}"', tag)
                  if tag.endswith("/>"):
                      return tag[:-2] + f' android:screenOrientation="{val}"/>'
                  return tag[:-1] + f' android:screenOrientation="{val}">'

              txt = re.sub(r'<activity\b[^>]*>', patch_activity, txt, count=1)

              if os.environ.get("HAS_CUSTOM_ICON") == "1":
                  def patch_app(m):
                      tag = m.group(0)
                      if "android:icon=" in tag:
                          tag = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', tag)
                      else:
                          tag = tag[:-1] + ' android:icon="@mipmap/ic_launcher">'
                      if "android:roundIcon=" in tag:
                          tag = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', tag)
                      return tag
                  txt = re.sub(r'<application\b[^>]*>', patch_app, txt, count=1)

              open(p, "w", encoding="utf-8").write(txt)
          PY

      - name: Build APK & AAB (Debug or Unsigned Release)
        env:
          FMT: ${{ github.event.inputs.build_format }}
          BTYPE: ${{ github.event.inputs.build_type }}
        run: |
          GRADLE_CMD="gradle"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          fi
          mkdir -p dist_out

          if [ "$BTYPE" = "release" ]; then
            if [ "$FMT" = "apk" ] || [ "$FMT" = "both" ]; then
              $GRADLE_CMD assembleRelease
              cp app/build/outputs/apk/release/*.apk dist_out/
            fi
            if [ "$FMT" = "aab" ] || [ "$FMT" = "both" ]; then
              $GRADLE_CMD bundleRelease
              cp app/build/outputs/bundle/release/*.aab dist_out/
            fi
          else
            if [ "$FMT" = "apk" ] || [ "$FMT" = "both" ]; then
              $GRADLE_CMD assembleDebug
              cp app/build/outputs/apk/debug/*.apk dist_out/
            fi
            if [ "$FMT" = "aab" ] || [ "$FMT" = "both" ]; then
              $GRADLE_CMD bundleDebug
              cp app/build/outputs/bundle/debug/*.aab dist_out/
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroEngine-Game-Build
          path: dist_out/*
          retention-days: 7
