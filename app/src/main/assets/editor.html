<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZeroEngine 手机版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
  body { background: #12141a; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { background: #1a1d26; padding: 8px 10px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #2d3343; }
  header h1 { font-size: 13px; color: #34d399; margin-right: auto; font-weight: 800; }
  button { background: #2b3142; color: #fff; border: 1px solid #3f475e; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  button:active { opacity: 0.7; }
  button.play { background: #10b981; border-color: #059669; color: #042f2e; font-weight: 800; }
  button.danger { background: #ef4444; border-color: #dc2626; }
  .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #0b0d11; overflow: hidden; touch-action: none; }
  canvas { background: #14171f; border: 2px solid #334155; max-width: 94%; max-height: 94%; }
  .inspector { background: #1a1d26; border-top: 1px solid #2d3343; padding: 10px; height: 225px; overflow-y: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #94a3b8; }
  .field input[type="text"], .field input[type="number"], .field input[type="color"] { background: #0f1117; border: 1px solid #334155; color: #fff; padding: 5px; border-radius: 4px; font-size: 12px; width: 100%; }
  .field.row { flex-direction: row; align-items: center; gap: 6px; padding-top: 14px; }
</style>
</head>
<body>

<header>
  <h1>ZeroEngine</h1>
  <button onclick="addRectNode()">+ 方块</button>
  <button onclick="pickNativeImage()">+ 导入PNG</button>
  <button class="play" onclick="playScene()">▶ 运行</button>
</header>

<div class="canvas-area">
  <canvas id="stage" width="1080" height="1920"></canvas>
</div>

<div class="inspector" id="inspector"></div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const imageCache = {};

let nodes = [
  { name: "Wall_Top", x: 540, y: 400, width: 600, height: 80, rotation: 0, texture: "", r: 0.35, g: 0.45, b: 0.65, a: 1, collider: true, tag: "obstacle" },
  { name: "Wall_Bottom", x: 540, y: 1300, width: 600, height: 80, rotation: 0, texture: "", r: 0.35, g: 0.45, b: 0.65, a: 1, collider: true, tag: "obstacle" }
];
let selectedIndex = 0;
let dragging = false, dragOffsetX = 0, dragOffsetY = 0;

// 启动时自动从手机本地存储恢复上次编辑的场景
window.onload = () => {
  if (window.ZeroBridge) {
    const saved = window.ZeroBridge.loadSavedScene();
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed.nodes)) {
          nodes = parsed.nodes;
          nodes.forEach(n => { if (n.texture) preloadLocalImage(n.texture); });
        }
      } catch (e) {}
    }
  }
  renderInspector();
  draw();
};

function preloadLocalImage(fileName) {
  if (!window.ZeroBridge || imageCache[fileName]) return;
  const dataUrl = window.ZeroBridge.getTextureBase64(fileName);
  if (dataUrl) {
    const img = new Image();
    img.onload = () => { imageCache[fileName] = img; draw(); };
    img.src = dataUrl;
  }
}

// 调用 Android 原生相册选择 PNG 图片
function pickNativeImage() {
  if (window.ZeroBridge) {
    window.ZeroBridge.pickImage();
  } else {
    alert("请在手机版 ZeroEngine App 中使用");
  }
}

// Android 选完图片后自动回调此函数
function onNativeImagePicked(fileName, dataUrl, w, h) {
  const img = new Image();
  img.onload = () => {
    imageCache[fileName] = img;
    nodes.push({
      name: fileName.replace(/\.[^.]+$/, ''),
      x: 540, y: 960,
      width: w || img.width || 200,
      height: h || img.height || 200,
      rotation: 0,
      texture: fileName,
      r: 1, g: 1, b: 1, a: 1,
      collider: true,
      tag: "prop"
    });
    selectedIndex = nodes.length - 1;
    autoSave();
    renderInspector();
    draw();
  };
  img.src = dataUrl;
}

function autoSave() {
  if (window.ZeroBridge) {
    window.ZeroBridge.saveScene(JSON.stringify({ nodes }));
  }
}

// 一键切换到原生 OpenGL 引擎运行当前场景！
function playScene() {
  const json = JSON.stringify({ nodes });
  if (window.ZeroBridge) {
    window.ZeroBridge.runGame(json);
  }
}

function rgbToHex(r, g, b) {
  const toHex = v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: +(((n >> 16) & 255) / 255).toFixed(2), g: +(((n >> 8) & 255) / 255).toFixed(2), b: +((n & 255) / 255).toFixed(2) };
}

function addRectNode() {
  nodes.push({ name: `Block_${nodes.length + 1}`, x: 540, y: 960, width: 220, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.8, b: 0.6, a: 1, collider: true, tag: "wall" });
  selectedIndex = nodes.length - 1;
  autoSave();
  renderInspector();
  draw();
}

function deleteSelected() {
  if (selectedIndex < 0) return;
  nodes.splice(selectedIndex, 1);
  selectedIndex = nodes.length - 1;
  autoSave();
  renderInspector();
  draw();
}

function getCanvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

function handleDown(clientX, clientY) {
  const pos = getCanvasPos(clientX, clientY);
  selectedIndex = -1;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (Math.abs(pos.x - n.x) <= n.width / 2 && Math.abs(pos.y - n.y) <= n.height / 2) {
      selectedIndex = i;
      dragging = true;
      dragOffsetX = pos.x - n.x;
      dragOffsetY = pos.y - n.y;
      break;
    }
  }
  renderInspector();
  draw();
}

function handleMove(clientX, clientY) {
  if (!dragging || selectedIndex < 0) return;
  const pos = getCanvasPos(clientX, clientY);
  nodes[selectedIndex].x = Math.round(pos.x - dragOffsetX);
  nodes[selectedIndex].y = Math.round(pos.y - dragOffsetY);
  renderInspector();
  draw();
}

function handleUp() {
  if (dragging) { dragging = false; autoSave(); }
}

canvas.addEventListener('touchstart', e => { if (e.touches.length) handleDown(e.touches[0].clientX, e.touches[0].clientY); });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length) handleMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend', handleUp);
canvas.addEventListener('mousedown', e => handleDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
window.addEventListener('mouseup', handleUp);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#1e222d';
  ctx.lineWidth = 2;
  for (let x = 0; x <= 1080; x += 180) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1920); ctx.stroke(); }
  for (let y = 0; y <= 1920; y += 180) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1080, y); ctx.stroke(); }

  nodes.forEach((n, idx) => {
    ctx.save();
    ctx.translate(n.x, n.y);
    ctx.rotate((n.rotation || 0) * Math.PI / 180);
    ctx.globalAlpha = n.a ?? 1;

    if (n.texture && imageCache[n.texture]) {
      ctx.drawImage(imageCache[n.texture], -n.width / 2, -n.height / 2, n.width, n.height);
    } else {
      ctx.fillStyle = rgbToHex(n.r, n.g, n.b);
      ctx.fillRect(-n.width / 2, -n.height / 2, n.width, n.height);
    }

    if (n.collider) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.setLineDash([12, 8]);
      ctx.strokeRect(-n.width / 2, -n.height / 2, n.width, n.height);
      ctx.setLineDash([]);
    }

    if (idx === selectedIndex) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 6;
      ctx.strokeRect(-n.width / 2 - 4, -n.height / 2 - 4, n.width + 8, n.height + 8);
    }
    ctx.restore();
  });
}

function updateProp(key, val) {
  if (selectedIndex < 0) return;
  nodes[selectedIndex][key] = val;
  autoSave();
  draw();
}

function updateColor(hex) {
  if (selectedIndex < 0) return;
  const c = hexToRgb(hex);
  nodes[selectedIndex].r = c.r;
  nodes[selectedIndex].g = c.g;
  nodes[selectedIndex].b = c.b;
  autoSave();
  draw();
}

function renderInspector() {
  const box = document.getElementById('inspector');
  if (selectedIndex < 0 || !nodes[selectedIndex]) {
    box.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;margin-top:40px;">点击上方“+ 方块”或“+ 导入PNG”添加物体</div>';
    return;
  }
  const n = nodes[selectedIndex];
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong style="font-size:13px;color:#fbbf24;">${n.name} (${selectedIndex + 1}/${nodes.length})</strong>
      <button class="danger" onclick="deleteSelected()">删除</button>
    </div>
    <div class="grid">
      <div class="field"><label>节点名称</label><input type="text" value="${n.name}" oninput="updateProp('name', this.value)"></div>
      <div class="field"><label>颜色 (纯色块)</label><input type="color" value="${rgbToHex(n.r, n.g, n.b)}" oninput="updateColor(this.value)"></div>
      <div class="field"><label>X 坐标</label><input type="number" value="${n.x}" oninput="updateProp('x', +this.value)"></div>
      <div class="field"><label>Y 坐标</label><input type="number" value="${n.y}" oninput="updateProp('y', +this.value)"></div>
      <div class="field"><label>宽度</label><input type="number" value="${n.width}" oninput="updateProp('width', +this.value)"></div>
      <div class="field"><label>高度</label><input type="number" value="${n.height}" oninput="updateProp('height', +this.value)"></div>
      <div class="field"><label>旋转角度</label><input type="number" value="${n.rotation || 0}" oninput="updateProp('rotation', +this.value)"></div>
      <div class="field row"><input type="checkbox" ${n.collider ? 'checked' : ''} onchange="updateProp('collider', this.checked)"><label>开启碰撞体</label></div>
    </div>
  `;
}
</script>
</body>
</html>
