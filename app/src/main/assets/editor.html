<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZeroEngine SDK</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #0b0e14; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
  header { background: #131822; padding: 5px 8px; display: flex; gap: 5px; align-items: center; border-bottom: 1px solid #232c3d; overflow-x: auto; }
  select.proj-sel { background: #0b0e14; color: #38bdf8; border: 1px solid #334155; padding: 4px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; }
  button { background: #1e2636; color: #e2e8f0; border: 1px solid #334155; padding: 4px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  button.active-toggle { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
  button.play { background: #10b981; border-color: #059669; color: #042f2e; font-weight: 800; margin-left: auto; }
  button.danger { background: #dc2626; border-color: #b91c1c; color: #fff; }

  .workspace { flex: 1; display: flex; overflow: hidden; }
  .scene-tree { width: 128px; background: #10141d; border-right: 1px solid #232c3d; display: flex; flex-direction: column; }
  .tree-header { padding: 5px 6px; font-size: 11px; color: #94a3b8; border-bottom: 1px solid #1e2533; display: flex; justify-content: space-between; align-items: center; }
  .tree-list { flex: 1; overflow-y: auto; padding: 4px; }
  .tree-item { padding: 5px; font-size: 11px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; }
  .tree-item.active { background: #1e3a8a; color: #93c5fd; font-weight: 700; }

  .viewport { flex: 1; position: relative; background: #07090e; overflow: hidden; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; }
  .vp-hud { position: absolute; top: 6px; left: 6px; font-size: 10px; color: #64748b; background: rgba(11,14,20,0.75); padding: 3px 6px; border-radius: 4px; pointer-events: none; font-family: monospace; }

  .bottom-dock { height: 275px; background: #131822; border-top: 1px solid #232c3d; display: flex; flex-direction: column; }
  .tabs { display: flex; background: #0e121a; border-bottom: 1px solid #232c3d; }
  .tab { flex: 1; text-align: center; padding: 6px 2px; font-size: 11px; color: #94a3b8; border-bottom: 2px solid transparent; }
  .tab.active { color: #38bdf8; border-bottom-color: #38bdf8; font-weight: 700; background: #131822; }
  .dock-body { flex: 1; overflow-y: auto; padding: 8px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: #94a3b8; }
  .field input, .field select { background: #090c12; border: 1px solid #334155; color: #fff; padding: 4px 5px; border-radius: 4px; font-size: 11px; width: 100%; }
  .field.row { flex-direction: row; align-items: center; gap: 5px; padding-top: 10px; }

  .script-toolbar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 5px; }
  .script-toolbar button { font-family: monospace; font-size: 10px; padding: 3px 6px; background: #1e293b; }
  textarea.code-box { width: 100%; height: 185px; background: #080a0f; color: #a5f3fc; border: 1px solid #334155; border-radius: 4px; padding: 7px; font-family: monospace; font-size: 11px; line-height: 1.4; resize: none; user-select: text; }
  pre#consoleOut, .doc-box { font-family: monospace; font-size: 11px; color: #cbd5e1; white-space: pre-wrap; line-height: 1.45; user-select: text; }
  .doc-box b { color: #38bdf8; }
</style>
</head>
<body>

<header>
  <select class="proj-sel" id="projSelect" onchange="switchProject(this.value)"></select>
  <button onclick="createNewProject()">+工程</button>
  <select class="proj-sel" id="sceneSelect" onchange="switchScene(this.value)"></select>
  <button onclick="createNewScene()">+场景</button>
  <button id="snapBtn" class="active-toggle" onclick="toggleSnap()">吸附:开</button>
  <button onclick="resetView()">居中</button>
  <button class="play" onclick="playScene()">▶ 运行</button>
</header>

<div class="workspace">
  <div class="scene-tree">
    <div class="tree-header">
      <span>场景节点</span>
      <div style="display:flex;gap:2px;">
        <button style="padding:2px 4px;font-size:10px;" onclick="addNode('Sprite2D')">+精</button>
        <button style="padding:2px 4px;font-size:10px;" onclick="addNode('Label2D')">+文</button>
        <button style="padding:2px 4px;font-size:10px;" onclick="pickNativeImage()">+图</button>
      </div>
    </div>
    <div class="tree-list" id="treeList"></div>
  </div>
  <div class="viewport" id="vpBox">
    <canvas id="stage"></canvas>
    <div class="vp-hud" id="vpHud">Zoom: 100% | 双指缩放/平移</div>
  </div>
</div>

<div class="bottom-dock">
  <div class="tabs">
    <div class="tab active" id="tab-inspector" onclick="switchTab('inspector')">检查器</div>
    <div class="tab" id="tab-script" onclick="switchTab('script')">脚本(JS)</div>
    <div class="tab" id="tab-shader" onclick="switchTab('shader')">着色器</div>
    <div class="tab" id="tab-console" onclick="switchTab('console')">控制台</div>
    <div class="tab" id="tab-docs" onclick="switchTab('docs')">API手册</div>
  </div>
  <div class="dock-body" id="dockBody"></div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const imageCache = {};
let activeTab = 'inspector';
let selectedIndex = 0;
let currentScene = 'main.scene';
let snapGrid = true;
const GRID_SIZE = 30;

// 视口摄像机变换（支持双指缩放和平移）
let camX = 540, camY = 960, camZoom = 0.42;
let dragMode = null; // 'move_xy' | 'move_x' | 'move_y' | 'rotate' | 'pan' | 'pinch'
let dragStartWorld = { x: 0, y: 0 };
let origNodeState = null;
let lastPanScreen = { x: 0, y: 0 };
let lastPinchDist = 0;

function defaultNodes() {
  return [
    {
      name: "CoreEntity", nodeType: "Sprite2D", parent: "",
      x: 540, y: 960, width: 150, height: 150, rotation: 0, scaleX: 1, scaleY: 1, zIndex: 1,
      texture: "", r: 0.22, g: 0.74, b: 0.97, a: 1, collider: true, isTrigger: false, tag: "player",
      hFrames: 1, vFrames: 1, currentFrame: 0, animStart: 0, animEnd: 0, animFps: 12, animPlaying: false, animLoop: true,
      shader: `precision mediump float;
uniform sampler2D uTexture;
uniform vec4 uColor;
uniform float uTime;
varying vec2 vTexCoord;
void main() {
  vec2 uv = vTexCoord - 0.5;
  float d = length(uv);
  float pulse = 0.75 + 0.25 * sin(uTime * 5.0 - d * 12.0);
  vec4 tex = texture2D(uTexture, vTexCoord) * uColor;
  gl_FragColor = vec4(tex.rgb * pulse, tex.a);
}`,
      script: `function onReady() {
  Engine.log("ZeroEngine SDK 就绪! 支持自定义 GLSL Shader 与多场景实例化");
  Engine.playTone(520, 90);
}

function onProcess(dt) {
  self.rotation += 35 * dt;
  if (Input.isTouching) {
    self.x += (Input.touchX - self.x) * 8 * dt;
    self.y += (Input.touchY - self.y) * 8 * dt;
  }
}

function onInput(ev) {
  if (ev.type === "down") {
    Engine.shake(12, 0.12);
    Engine.playTone(780, 60);
    Engine.spawn({
      name: "Wave", x: self.x, y: self.y, width: 40, height: 40,
      r: 0.98, g: 0.8, b: 0.15,
      script: "var t=0.5; function onProcess(dt){ t-=dt; self.scaleX+=4*dt; self.scaleY+=4*dt; self.a=t/0.5; if(t<=0) Engine.destroy(self); }"
    }, "");
  }
}`
    },
    {
      name: "Satellite", nodeType: "Sprite2D", parent: "CoreEntity",
      x: 190, y: 0, width: 48, height: 48, rotation: 0, scaleX: 1, scaleY: 1, zIndex: 2,
      texture: "", r: 0.96, g: 0.25, b: 0.37, a: 1, collider: true, isTrigger: true, tag: "satellite",
      hFrames: 1, vFrames: 1, currentFrame: 0, animStart: 0, animEnd: 0, animFps: 12, animPlaying: false, animLoop: true,
      shader: "", script: ""
    }
  ];
}

let nodes = defaultNodes();

function resizeCanvas() {
  const box = document.getElementById('vpBox');
  canvas.width = box.clientWidth * window.devicePixelRatio;
  canvas.height = box.clientHeight * window.devicePixelRatio;
  draw();
}
window.addEventListener('resize', resizeCanvas);

window.onload = () => {
  resizeCanvas();
  if (window.ZeroBridge) {
    refreshProjectAndSceneLists();
    loadCurrentSceneFromDisk();
  }
  refreshAll();
};

function refreshProjectAndSceneLists() {
  if (!window.ZeroBridge) return;
  const projs = JSON.parse(window.ZeroBridge.listProjects());
  const curP = window.ZeroBridge.getCurrentProject();
  document.getElementById('projSelect').innerHTML = projs.map(p => `<option value="${p}" ${p === curP ? 'selected' : ''}>工程:${p}</option>`).join('');

  const scenes = JSON.parse(window.ZeroBridge.listScenes());
  if (!scenes.includes(currentScene)) currentScene = scenes[0] || 'main.scene';
  document.getElementById('sceneSelect').innerHTML = scenes.map(s => `<option value="${s}" ${s === currentScene ? 'selected' : ''}>${s}</option>`).join('');
}

function loadCurrentSceneFromDisk() {
  if (!window.ZeroBridge) return;
  const raw = window.ZeroBridge.loadSceneFile(currentScene);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      nodes = Array.isArray(parsed.nodes) ? parsed.nodes : [];
      nodes.forEach(n => { if (n.texture) preloadLocalImage(n.texture); });
    } catch (e) { nodes = defaultNodes(); }
  } else {
    nodes = currentScene === 'main.scene' ? defaultNodes() : [];
    autoSave();
  }
  selectedIndex = nodes.length > 0 ? 0 : -1;
}

function createNewProject() {
  const name = prompt("输入新工程名称 (英文/数字):", "Game_" + (Date.now() % 1000));
  if (!name || !window.ZeroBridge) return;
  window.ZeroBridge.setProject(name);
  currentScene = 'main.scene';
  nodes = defaultNodes();
  autoSave();
  refreshProjectAndSceneLists();
  refreshAll();
}

function switchProject(name) {
  if (!window.ZeroBridge) return;
  window.ZeroBridge.setProject(name);
  currentScene = 'main.scene';
  refreshProjectAndSceneLists();
  loadCurrentSceneFromDisk();
  refreshAll();
}

function createNewScene() {
  const name = prompt("输入新场景/预制体文件名 (如 enemy.scene):", "prefab_" + (Date.now() % 100) + ".scene");
  if (!name) return;
  currentScene = name.endsWith('.scene') ? name : name + '.scene';
  nodes = [];
  autoSave();
  refreshProjectAndSceneLists();
  refreshAll();
}

function switchScene(sceneName) {
  currentScene = sceneName;
  loadCurrentSceneFromDisk();
  refreshAll();
}

function toggleSnap() {
  snapGrid = !snapGrid;
  const btn = document.getElementById('snapBtn');
  btn.textContent = snapGrid ? '吸附:开' : '吸附:关';
  btn.classList.toggle('active-toggle', snapGrid);
}

function resetView() {
  camX = 540; camY = 960; camZoom = 0.42;
  draw();
}

function preloadLocalImage(fileName) {
  if (!window.ZeroBridge || imageCache[fileName]) return;
  const dataUrl = window.ZeroBridge.getTextureBase64(fileName);
  if (dataUrl) {
    const img = new Image();
    img.onload = () => { imageCache[fileName] = img; draw(); };
    img.src = dataUrl;
  }
}

function pickNativeImage() { if (window.ZeroBridge) window.ZeroBridge.pickImage(); }

function onNativeImagePicked(fileName, dataUrl, w, h) {
  const img = new Image();
  img.onload = () => {
    imageCache[fileName] = img;
    nodes.push({
      name: fileName.replace(/\.[^.]+$/, ''), nodeType: "Sprite2D", parent: "",
      x: 540, y: 960, width: w || img.width || 160, height: h || img.height || 160,
      rotation: 0, scaleX: 1, scaleY: 1, zIndex: 0,
      texture: fileName, r: 1, g: 1, b: 1, a: 1, collider: true, isTrigger: false, tag: "sprite",
      hFrames: 1, vFrames: 1, currentFrame: 0, animStart: 0, animEnd: 0, animFps: 12, animPlaying: false, animLoop: true,
      shader: "", script: ""
    });
    selectedIndex = nodes.length - 1;
    autoSave();
    refreshAll();
  };
  img.src = dataUrl;
}

function autoSave() {
  if (window.ZeroBridge) window.ZeroBridge.saveSceneFile(currentScene, JSON.stringify({ nodes }));
}

function playScene() {
  autoSave();
  if (window.ZeroBridge) window.ZeroBridge.runGame(JSON.stringify({ nodes }));
}

function addNode(type) {
  const idx = nodes.length + 1;
  nodes.push({
    name: `${type}_${idx}`, nodeType: type, parent: "",
    x: 540, y: 960, width: 150, height: 150, rotation: 0, scaleX: 1, scaleY: 1, zIndex: 0,
    text: type === 'Label2D' ? 'Label' : '', fontSize: 44,
    texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: type === 'Sprite2D', isTrigger: false, tag: "default",
    hFrames: 1, vFrames: 1, currentFrame: 0, animStart: 0, animEnd: 0, animFps: 12, animPlaying: false, animLoop: true,
    shader: "", script: ""
  });
  selectedIndex = nodes.length - 1;
  autoSave();
  refreshAll();
}

function duplicateSelected() {
  if (selectedIndex < 0) return;
  const copy = JSON.parse(JSON.stringify(nodes[selectedIndex]));
  copy.name += "_copy"; copy.x += 60; copy.y += 60;
  nodes.push(copy);
  selectedIndex = nodes.length - 1;
  autoSave();
  refreshAll();
}

function deleteSelected() {
  if (selectedIndex < 0) return;
  const removedName = nodes[selectedIndex].name;
  nodes.splice(selectedIndex, 1);
  nodes.forEach(n => { if (n.parent === removedName) n.parent = ""; });
  selectedIndex = nodes.length - 1;
  autoSave();
  refreshAll();
}

function getGlobalTransform(n, visited = new Set()) {
  if (!n.parent || visited.has(n.name)) {
    return { gx: n.x, gy: n.y, gRot: n.rotation || 0, gSx: n.scaleX ?? 1, gSy: n.scaleY ?? 1 };
  }
  visited.add(n.name);
  const p = nodes.find(item => item.name === n.parent);
  if (!p) return { gx: n.x, gy: n.y, gRot: n.rotation || 0, gSx: n.scaleX ?? 1, gSy: n.scaleY ?? 1 };
  const pt = getGlobalTransform(p, visited);
  const rad = pt.gRot * Math.PI / 180;
  const sx = n.x * pt.gSx, sy = n.y * pt.gSy;
  return {
    gx: pt.gx + (sx * Math.cos(rad) - sy * Math.sin(rad)),
    gy: pt.gy + (sx * Math.sin(rad) + sy * Math.cos(rad)),
    gRot: pt.gRot + (n.rotation || 0),
    gSx: pt.gSx * (n.scaleX ?? 1),
    gSy: pt.gSy * (n.scaleY ?? 1)
  };
}

function screenToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const sx = (clientX - rect.left) * (canvas.width / rect.width);
  const sy = (clientY - rect.top) * (canvas.height / rect.height);
  return {
    x: (sx - canvas.width / 2) / camZoom + camX,
    y: (sy - canvas.height / 2) / camZoom + camY
  };
}

function applySnap(v) { return snapGrid ? Math.round(v / GRID_SIZE) * GRID_SIZE : Math.round(v); }

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    dragMode = 'pinch';
    lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    lastPanScreen = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
    return;
  }
  if (e.touches.length === 1) {
    const wp = screenToWorld(e.touches[0].clientX, e.touches[0].clientY);
    const gizmoLen = 110 / camZoom;
    const hitR = 32 / camZoom;

    // 1. 优先检测当前选中节点的专业 Gizmo 手柄
    if (selectedIndex >= 0 && nodes[selectedIndex]) {
      const sel = nodes[selectedIndex];
      const gt = getGlobalTransform(sel);
      if (Math.hypot(wp.x - (gt.gx + gizmoLen), wp.y - gt.gy) < hitR) {
        dragMode = 'move_x'; dragStartWorld = wp; origNodeState = { ...sel }; return;
      }
      if (Math.hypot(wp.x - gt.gx, wp.y - (gt.gy + gizmoLen)) < hitR) {
        dragMode = 'move_y'; dragStartWorld = wp; origNodeState = { ...sel }; return;
      }
      if (Math.hypot(wp.x - gt.gx, wp.y - (gt.gy - gizmoLen)) < hitR) {
        dragMode = 'rotate'; dragStartWorld = wp; origNodeState = { ...sel }; return;
      }
    }

    // 2. 命中节点主体
    let hit = -1;
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i], gt = getGlobalTransform(n);
      if (Math.abs(wp.x - gt.gx) <= (n.width * gt.gSx) / 2 && Math.abs(wp.y - gt.gy) <= (n.height * gt.gSy) / 2) {
        hit = i; break;
      }
    }
    if (hit >= 0) {
      selectedIndex = hit;
      dragMode = 'move_xy';
      dragStartWorld = wp;
      origNodeState = { ...nodes[hit] };
      refreshAll();
    } else {
      dragMode = 'pan';
      lastPanScreen = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragMode === 'pinch' && e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (lastPinchDist > 0) camZoom = Math.min(3, Math.max(0.15, camZoom * (dist / lastPinchDist)));
    const dpr = window.devicePixelRatio;
    camX -= (midX - lastPanScreen.x) * dpr / camZoom;
    camY -= (midY - lastPanScreen.y) * dpr / camZoom;
    lastPinchDist = dist;
    lastPanScreen = { x: midX, y: midY };
    draw();
    return;
  }
  if (e.touches.length !== 1) return;
  if (dragMode === 'pan') {
    const dpr = window.devicePixelRatio;
    camX -= (e.touches[0].clientX - lastPanScreen.x) * dpr / camZoom;
    camY -= (e.touches[0].clientY - lastPanScreen.y) * dpr / camZoom;
    lastPanScreen = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    draw();
    return;
  }
  if (selectedIndex < 0 || !origNodeState) return;
  const wp = screenToWorld(e.touches[0].clientX, e.touches[0].clientY);
  const n = nodes[selectedIndex];
  const dx = wp.x - dragStartWorld.x, dy = wp.y - dragStartWorld.y;

  if (dragMode === 'move_xy') { n.x = applySnap(origNodeState.x + dx); n.y = applySnap(origNodeState.y + dy); }
  else if (dragMode === 'move_x') { n.x = applySnap(origNodeState.x + dx); }
  else if (dragMode === 'move_y') { n.y = applySnap(origNodeState.y + dy); }
  else if (dragMode === 'rotate') {
    const gt = getGlobalTransform(n);
    n.rotation = Math.round(Math.atan2(wp.y - gt.gy, wp.x - gt.gx) * 180 / Math.PI + 90);
  }
  if (activeTab === 'inspector') renderDock();
  draw();
}, { passive: false });

canvas.addEventListener('touchend', () => {
  if (dragMode && dragMode !== 'pan' && dragMode !== 'pinch') autoSave();
  dragMode = null;
});

function rgbToHex(r, g, b) {
  const f = v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0');
  return `#${f(r)}${f(g)}${f(b)}`;
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: +(((n >> 16) & 255) / 255).toFixed(2), g: +(((n >> 8) & 255) / 255).toFixed(2), b: +((n & 255) / 255).toFixed(2) };
}

function draw() {
  document.getElementById('vpHud').textContent = `Zoom: ${Math.round(camZoom * 100)}% | 场景: ${currentScene}`;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(camZoom, camZoom);
  ctx.translate(-camX, -camY);

  // 1. 无限世界网格 + 1080x1920 基准视口框
  ctx.strokeStyle = '#151b26';
  ctx.lineWidth = 2 / camZoom;
  for (let x = -1080; x <= 2160; x += 180) { ctx.beginPath(); ctx.moveTo(x, -1920); ctx.lineTo(x, 3840); ctx.stroke(); }
  for (let y = -1920; y <= 3840; y += 180) { ctx.beginPath(); ctx.moveTo(-1080, y); ctx.lineTo(2160, y); ctx.stroke(); }

  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 4 / camZoom;
  ctx.strokeRect(0, 0, 1080, 1920);

  // 2. 渲染节点与 SpriteSheet 当前帧切片
  nodes.forEach((n, idx) => {
    const gt = getGlobalTransform(n);
    const w = n.width * gt.gSx, h = n.height * gt.gSy;

    ctx.save();
    ctx.translate(gt.gx, gt.gy);
    ctx.rotate(gt.gRot * Math.PI / 180);
    ctx.globalAlpha = n.a ?? 1;

    if (n.nodeType === 'Label2D') {
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${n.fontSize || 44}px sans-serif`;
      ctx.fillText(n.text || 'Label', -w / 2, 10);
    } else if (n.texture && imageCache[n.texture]) {
      const img = imageCache[n.texture];
      const hf = Math.max(1, n.hFrames || 1), vf = Math.max(1, n.vFrames || 1);
      const fi = Math.min(hf * vf - 1, Math.max(0, n.currentFrame || 0));
      const sw = img.width / hf, sh = img.height / vf;
      ctx.drawImage(img, (fi % hf) * sw, Math.floor(fi / hf) * sh, sw, sh, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = rgbToHex(n.r, n.g, n.b);
      ctx.fillRect(-w / 2, -h / 2, w, h);
    }

    if (n.collider) {
      ctx.strokeStyle = n.isTrigger ? '#a855f7' : '#38bdf8';
      ctx.lineWidth = 3 / camZoom;
      ctx.setLineDash([10 / camZoom, 6 / camZoom]);
      ctx.strokeRect(-w / 2, -h / 2, w, h);
      ctx.setLineDash([]);
    }
    ctx.restore();

    // 3. 选中节点的工业级 Gizmo（双轴箭头 + 旋转手柄）
    if (idx === selectedIndex) {
      const len = 110 / camZoom;
      const rHandle = 14 / camZoom;
      ctx.save();
      ctx.translate(gt.gx, gt.gy);

      // X 轴红色手柄
      ctx.strokeStyle = '#ef4444'; ctx.fillStyle = '#ef4444'; ctx.lineWidth = 4 / camZoom;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(len, 0, rHandle, 0, Math.PI * 2); ctx.fill();

      // Y 轴绿色手柄
      ctx.strokeStyle = '#22c55e'; ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, len, rHandle, 0, Math.PI * 2); ctx.fill();

      // 旋转控制柄（顶部黄色圆环）
      ctx.strokeStyle = '#fbbf24'; ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -len, rHandle, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }
  });

  ctx.restore();
}

function renderTree() {
  document.getElementById('treeList').innerHTML = nodes.map((n, i) => {
    const indent = n.parent ? '└ ' : '';
    const badges = (n.script && n.script.trim() ? '📜' : '') + (n.shader && n.shader.trim() ? '✨' : '');
    return `<div class="tree-item ${i === selectedIndex ? 'active' : ''}" onclick="selectNode(${i})">${indent}${n.name} ${badges}</div>`;
  }).join('');
}

function selectNode(i) { selectedIndex = i; refreshAll(); }

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  renderDock();
}

function updateProp(key, val) {
  if (selectedIndex < 0) return;
  if (key === 'name') {
    const oldName = nodes[selectedIndex].name;
    nodes.forEach(item => { if (item.parent === oldName) item.parent = val; });
  }
  nodes[selectedIndex][key] = val;
  autoSave();
  renderTree();
  draw();
}

function updateColor(hex) {
  if (selectedIndex < 0) return;
  const c = hexToRgb(hex);
  nodes[selectedIndex].r = c.r; nodes[selectedIndex].g = c.g; nodes[selectedIndex].b = c.b;
  autoSave(); draw();
}

function insertCode(id, snip) {
  const ta = document.getElementById(id);
  if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.substring(0, s) + snip + ta.value.substring(e);
  ta.selectionStart = ta.selectionEnd = s + snip.length;
  ta.focus();
  updateProp(id === 'shaderEditor' ? 'shader' : 'script', ta.value);
}

function refreshConsoleFromNative() { if (activeTab === 'console') renderDock(); }

function renderDock() {
  const body = document.getElementById('dockBody');
  if (activeTab === 'docs') {
    body.innerHTML = `<div class="doc-box">
<b>ZeroEngine SDK v0.2 核心 API 手册</b><br>
• <b>生命周期</b>: onReady(), onProcess(dt), onInput(ev)<br>
• <b>自身属性</b>: self.x, self.y, self.vx, self.vy, self.rotation, self.scaleX, self.scaleY, self.a, self.visible<br>
• <b>帧动画</b>: self.playAnim(start, end, fps, loop) / self.stopAnim()<br>
• <b>物理运动</b>: Engine.moveAndSlide(self, dt) / Engine.raycast(x1, y1, x2, y2, ignoreTag)<br>
• <b>场景与预制体</b>: Engine.instantiate("enemy.scene", x, y) / Engine.spawn({...}, parentName) / Engine.destroy(node)<br>
• <b>信号总线</b>: Engine.on("hit", fn) / Engine.emit("hit", data)<br>
• <b>相机与音频</b>: Engine.shake(intensity, sec) / Engine.setCameraTarget(node) / Engine.playTone(hz, ms)<br>
• <b>Shader内置变量</b>: uniform sampler2D uTexture; uniform vec4 uColor; uniform float uTime; varying vec2 vTexCoord;
</div>`;
    return;
  }

  if (activeTab === 'console') {
    const logs = window.ZeroBridge ? window.ZeroBridge.getConsoleLogs() : 'Console ready.';
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:11px;color:#94a3b8;">JS 虚拟机与 GLSL 着色器实时输出</span>
        <button style="padding:2px 6px;font-size:10px;" onclick="if(window.ZeroBridge)window.ZeroBridge.clearConsoleLogs();renderDock();">清空</button>
      </div>
      <pre id="consoleOut">${logs || '(暂无日志输出)'}</pre>`;
    return;
  }

  if (selectedIndex < 0 || !nodes[selectedIndex]) {
    body.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;margin-top:45px;">请在左侧节点树或视口中选择节点</div>';
    return;
  }

  const n = nodes[selectedIndex];
  if (activeTab === 'script') {
    body.innerHTML = `
      <div class="script-toolbar">
        <button onclick="insertCode('scriptEditor','function onReady() {\\n  \\n}\\n')">+onReady</button>
        <button onclick="insertCode('scriptEditor','function onProcess(dt) {\\n  \\n}\\n')">+onProcess</button>
        <button onclick="insertCode('scriptEditor','function onInput(ev) {\\n  \\n}\\n')">+onInput</button>
        <button onclick="insertCode('scriptEditor','Engine.moveAndSlide(self, dt)')">moveAndSlide</button>
        <button onclick="insertCode('scriptEditor','Engine.raycast(')">raycast</button>
        <button onclick="insertCode('scriptEditor','Engine.instantiate(\\'\\', self.x, self.y)')">instantiate</button>
      </div>
      <textarea id="scriptEditor" class="code-box" spellcheck="false" oninput="updateProp('script', this.value)">${n.script || ''}</textarea>`;
    return;
  }

  if (activeTab === 'shader') {
    const template = `precision mediump float;\nuniform sampler2D uTexture;\nuniform vec4 uColor;\nuniform float uTime;\nvarying vec2 vTexCoord;\nvoid main() {\n  vec4 c = texture2D(uTexture, vTexCoord) * uColor;\n  gl_FragColor = c;\n}`;
    body.innerHTML = `
      <div class="script-toolbar">
        <button onclick="updateProp('shader', \`${template}\`);renderDock();">载入默认GLSL模板</button>
        <button onclick="updateProp('shader', '');renderDock();">清除Shader</button>
      </div>
      <textarea id="shaderEditor" class="code-box" spellcheck="false" placeholder="编写 OpenGL ES 2.0 Fragment Shader..." oninput="updateProp('shader', this.value)">${n.shader || ''}</textarea>`;
    return;
  }

  const parentOptions = [`<option value="">(根节点 Root)</option>`]
    .concat(nodes.filter((_, idx) => idx !== selectedIndex).map(p => `<option value="${p.name}" ${n.parent === p.name ? 'selected' : ''}>${p.name}</option>`))
    .join('');

  body.innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:7px;">
      <input style="background:#090c12;border:1px solid #334155;color:#fbbf24;font-weight:700;padding:4px 6px;border-radius:4px;font-size:12px;flex:1;" value="${n.name}" onchange="updateProp('name', this.value)">
      <button onclick="duplicateSelected()">复制</button>
      <button class="danger" onclick="deleteSelected()">删除</button>
    </div>
    <div class="grid">
      <div class="field"><label>父节点 (Hierarchy)</label><select onchange="updateProp('parent', this.value)">${parentOptions}</select></div>
      <div class="field"><label>节点标签 (Tag)</label><input value="${n.tag || 'default'}" oninput="updateProp('tag', this.value)"></div>
      <div class="field"><label>局部 X</label><input type="number" value="${n.x}" oninput="updateProp('x', +this.value)"></div>
      <div class="field"><label>局部 Y</label><input type="number" value="${n.y}" oninput="updateProp('y', +this.value)"></div>
      <div class="field"><label>宽度</label><input type="number" value="${n.width}" oninput="updateProp('width', +this.value)"></div>
      <div class="field"><label>高度</label><input type="number" value="${n.height}" oninput="updateProp('height', +this.value)"></div>
      <div class="field"><label>旋转角度</label><input type="number" value="${n.rotation || 0}" oninput="updateProp('rotation', +this.value)"></div>
      <div class="field"><label>渲染层级 (Z-Index)</label><input type="number" value="${n.zIndex || 0}" oninput="updateProp('zIndex', +this.value)"></div>
      ${n.nodeType === 'Label2D'
        ? `<div class="field"><label>文本内容</label><input value="${n.text || ''}" oninput="updateProp('text', this.value)"></div>
           <div class="field"><label>字号</label><input type="number" value="${n.fontSize || 44}" oninput="updateProp('fontSize', +this.value)"></div>`
        : `<div class="field"><label>混合颜色</label><input type="color" value="${rgbToHex(n.r, n.g, n.b)}" oninput="updateColor(this.value)"></div>
           <div class="field"><label>透明度 (0~1)</label><input type="number" step="0.1" value="${n.a ?? 1}" oninput="updateProp('a', +this.value)"></div>
           <div class="field"><label>序列帧列数 (H-Frames)</label><input type="number" min="1" value="${n.hFrames || 1}" oninput="updateProp('hFrames', Math.max(1,+this.value))"></div>
           <div class="field"><label>序列帧行数 (V-Frames)</label><input type="number" min="1" value="${n.vFrames || 1}" oninput="updateProp('vFrames', Math.max(1,+this.value))"></div>
           <div class="field"><label>当前帧索引 (Frame)</label><input type="number" min="0" value="${n.currentFrame || 0}" oninput="updateProp('currentFrame', Math.max(0,+this.value))"></div>
           <div class="field"><label>播放帧率 (FPS)</label><input type="number" min="1" value="${n.animFps || 12}" oninput="updateProp('animFps', Math.max(1,+this.value))"></div>`
      }
      <div class="field row"><input type="checkbox" ${n.collider ? 'checked' : ''} onchange="updateProp('collider', this.checked)"><label>碰撞体 (Collider)</label></div>
      <div class="field row"><input type="checkbox" ${n.isTrigger ? 'checked' : ''} onchange="updateProp('isTrigger', this.checked)"><label>触发器 (Area2D)</label></div>
    </div>`;
}

function refreshAll() { renderTree(); renderDock(); draw(); }
</script>
</body>
</html>
