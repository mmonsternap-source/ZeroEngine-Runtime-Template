<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZeroEngine Pro IDE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #0b0e14; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
  header { background: #131822; padding: 5px 8px; display: flex; flex-direction: column; gap: 5px; border-bottom: 1px solid #232c3d; }
  .header-row { display: flex; gap: 4px; align-items: center; width: 100%; overflow-x: auto; }
  select.proj-sel { background: #0b0e14; color: #38bdf8; border: 1px solid #334155; padding: 4px 5px; border-radius: 4px; font-size: 11px; font-weight: 700; max-width: 115px; }
  button { background: #1e2636; color: #e2e8f0; border: 1px solid #334155; padding: 4px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  button:disabled { opacity: 0.38; }
  button.active-toggle { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
  button.save-btn { background: #0284c7; border-color: #0369a1; color: #fff; }
  button.export-btn { background: #7c3aed; border-color: #6d28d9; color: #fff; }
  button.play { background: #10b981; border-color: #059669; color: #042f2e; font-weight: 800; margin-left: auto; }
  button.danger { background: #dc2626; border-color: #b91c1c; color: #fff; }

  .workspace { flex: 1; display: flex; overflow: hidden; }
  .scene-tree { width: 136px; background: #10141d; border-right: 1px solid #232c3d; display: flex; flex-direction: column; }
  .tree-header { padding: 5px; font-size: 10px; color: #94a3b8; border-bottom: 1px solid #1e2533; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .tree-header button { padding: 3px 5px; font-size: 10px; }
  .tree-list { flex: 1; overflow-y: auto; padding: 4px; }
  .tree-item { padding: 5px; font-size: 11px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; }
  .tree-item.active { background: #1e3a8a; color: #93c5fd; font-weight: 700; }

  .viewport { flex: 1; position: relative; background: #07090e; overflow: hidden; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; }
  .vp-hud { position: absolute; top: 6px; left: 6px; font-size: 10px; color: #94a3b8; background: rgba(11,14,20,0.82); padding: 3px 6px; border-radius: 4px; pointer-events: none; font-family: monospace; }

  .bottom-dock { height: 285px; background: #131822; border-top: 1px solid #232c3d; display: flex; flex-direction: column; }
  .tabs { display: flex; background: #0e121a; border-bottom: 1px solid #232c3d; }
  .tab { flex: 1; text-align: center; padding: 6px 2px; font-size: 11px; color: #94a3b8; border-bottom: 2px solid transparent; }
  .tab.active { color: #38bdf8; border-bottom-color: #38bdf8; font-weight: 700; background: #131822; }
  .dock-body { flex: 1; overflow-y: auto; padding: 8px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: #94a3b8; }
  .field input, .field select { background: #090c12; border: 1px solid #334155; color: #fff; padding: 4px 5px; border-radius: 4px; font-size: 11px; width: 100%; }
  .field.row { flex-direction: row; align-items: center; gap: 5px; padding-top: 6px; }

  .clip-box { margin-top: 10px; padding: 7px; background: #0c1018; border: 1px solid #232c3d; border-radius: 6px; }
  .clip-row { display: grid; grid-template-columns: 1.3fr 0.7fr 0.7fr 0.7fr auto auto; gap: 4px; align-items: center; margin-top: 5px; font-size: 10px; }
  .clip-row input { background: #090c12; border: 1px solid #334155; color: #fff; padding: 3px 4px; border-radius: 3px; font-size: 10px; width: 100%; }

  .palette-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; max-height: 92px; overflow-y: auto; }
  .palette-cell { width: 34px; height: 34px; border: 1px solid #334155; border-radius: 4px; background-color: #090c12; background-repeat: no-repeat; position: relative; }
  .palette-cell.selected { border: 2px solid #38bdf8; box-shadow: 0 0 6px rgba(56,189,248,0.6); }
  .palette-idx { position: absolute; bottom: 0; right: 1px; font-size: 8px; color: #fff; background: rgba(0,0,0,0.65); padding: 0 2px; }

  .script-toolbar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 5px; }
  .script-toolbar button { font-family: monospace; font-size: 10px; padding: 3px 6px; background: #1e293b; }
  textarea.code-box { width: 100%; height: 185px; background: #080a0f; color: #a5f3fc; border: 1px solid #334155; border-radius: 4px; padding: 7px; font-family: monospace; font-size: 11px; line-height: 1.4; resize: none; user-select: text; }
  pre#consoleOut, .doc-box { font-family: monospace; font-size: 11px; color: #cbd5e1; white-space: pre-wrap; line-height: 1.45; user-select: text; }
  .doc-box b { color: #38bdf8; }

  .modal-mask { position: fixed; inset: 0; background: rgba(2,6,23,0.84); display: none; align-items: center; justify-content: center; z-index: 999; padding: 18px; }
  .modal-card { background: #131822; border: 1px solid #334155; border-radius: 8px; padding: 14px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
  .modal-title { font-size: 13px; font-weight: 700; color: #38bdf8; }
  .modal-input { background: #090c12; border: 1px solid #3b82f6; color: #fff; padding: 8px; border-radius: 5px; font-size: 13px; user-select: text; }
  .path-box { background: #090c12; border: 1px solid #334155; color: #34d399; padding: 8px; border-radius: 5px; font-family: monospace; font-size: 11px; word-break: break-all; user-select: text; line-height: 1.4; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .toast-bar { position: fixed; bottom: 300px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.95); color: #34d399; border: 1px solid #059669; padding: 6px 12px; border-radius: 6px; font-size: 11px; z-index: 998; display: none; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <button onclick="openNewMenuModal()">📄新建</button>
    <button class="save-btn" onclick="manualSave()">💾保存</button>
    <button onclick="showSaveLocationModal()">📂位置</button>
    <select class="proj-sel" id="projSelect" onchange="switchProject(this.value)"></select>
    <select class="proj-sel" id="sceneSelect" onchange="switchScene(this.value)"></select>
  </div>
  <div class="header-row">
    <button id="undoBtn" onclick="undo()" disabled>↩撤销</button>
    <button id="redoBtn" onclick="redo()" disabled>↪重做</button>
    <button id="modeBtn" class="active-toggle" onclick="toggleCamMode()">2.5D</button>
    <button id="snapBtn" class="active-toggle" onclick="toggleSnap()">吸附</button>
    <button onclick="resetView()">居中</button>
    <button class="export-btn" onclick="exportBundle()">📦导出</button>
    <button class="play" onclick="playScene()">▶ 运行</button>
  </div>
</header>

<div class="workspace">
  <div class="scene-tree">
    <div class="tree-header">
      <button onclick="addNode('Sprite2D')">+精</button>
      <button onclick="addNode('TileMap')">+瓦</button>
      <button onclick="addNode('ParticleEmitter')">+粒</button>
      <button onclick="pickNativeImage()">+图</button>
      <button onclick="pickNativeAudio()">+音</button>
      <button onclick="addNode('PointLight')">+光</button>
      <button onclick="addNode('Label2D')">+文</button>
      <button onclick="addUINode()">+UI</button>
    </div>
    <div class="tree-list" id="treeList"></div>
  </div>
  <div class="viewport" id="vpBox">
    <canvas id="stage"></canvas>
    <div class="vp-hud" id="vpHud">ZeroEngine IDE | 2.5D</div>
  </div>
</div>

<div class="bottom-dock">
  <div class="tabs">
    <div class="tab active" id="tab-inspector" onclick="switchTab('inspector')">检查器</div>
    <div class="tab" id="tab-script" onclick="switchTab('script')">脚本(JS)</div>
    <div class="tab" id="tab-shader" onclick="switchTab('shader')">着色器</div>
    <div class="tab" id="tab-console" onclick="switchTab('console')">控制台</div>
    <div class="tab" id="tab-docs" onclick="switchTab('docs')">工程/API</div>
  </div>
  <div class="dock-body" id="dockBody"></div>
</div>

<!-- 新建菜单弹窗 -->
<div class="modal-mask" id="newMenuModal">
  <div class="modal-card">
    <div class="modal-title">📄 新建 (New)</div>
    <div style="font-size:11px;color:#94a3b8;">请选择要创建的类型（所有文件自动存入工程目录）：</div>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateProjectModal(false)">🆕 新建空白游戏工程 (Empty Project)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateProjectModal(true)">🎮 新建 2.5D 动作模板工程 (Template)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateSceneModal()">🗺️ 在当前工程新建关卡场景 (.scene)</button>
    <div class="modal-actions">
      <button onclick="closeNewMenuModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 名称输入弹窗 -->
<div class="modal-mask" id="inputModal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">新建</div>
    <input class="modal-input" id="modalInput" type="text" placeholder="请输入英文或数字名称...">
    <div class="modal-actions">
      <button onclick="closeInputModal()">取消</button>
      <button class="play" style="margin-left:0;" onclick="confirmInputModal()">确定创建</button>
    </div>
  </div>
</div>

<!-- 存档文件夹位置弹窗 -->
<div class="modal-mask" id="pathModal">
  <div class="modal-card">
    <div class="modal-title">📂 工程文件夹 Save 位置</div>
    <div style="font-size:11px;color:#94a3b8;">当前工程的 scenes / textures / audio / exports 均保存在手机以下目录：</div>
    <div class="path-box" id="savePathText">/storage/emulated/0/Android/data/com.zero.engine/files/ZeroEngine/</div>
    <div class="modal-actions">
      <button onclick="copySavePath()">复制路径</button>
      <button class="save-btn" onclick="document.getElementById('pathModal').style.display='none'">知道了</button>
    </div>
  </div>
</div>

<div class="toast-bar" id="toastBar"></div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const imageCache = {};
let audioAssets = [];
let activeTab = 'inspector';
let selectedIndex = 0;
let currentScene = 'main.scene';
let snapGrid = true;
const GRID_SIZE = 30;

let tileBrushMode = 'off';
let brushFrame = 0;

let cameraCfg = { mode: '2.5D', pitch: 48, distance: 1250, minX: -2000, maxX: 4000, minY: -2000, maxY: 4000 };
let camX = 540, camY = 960, camZoom = 0.42;
let dragMode = null, dragStartWorld = { x: 0, y: 0 }, origNodeState = null;
let lastPanScreen = { x: 0, y: 0 }, lastPinchDist = 0;
let modalCallback = null;

const MAX_HISTORY = 40;
let undoStack = [];
let redoStack = [];
let pendingSnapshot = null;
let inputDebounceTimer = null;

function createSnapshot() {
  return JSON.stringify({ camera: cameraCfg, nodes, selectedIndex });
}

function updateUndoRedoButtons() {
  const uBtn = document.getElementById('undoBtn');
  const rBtn = document.getElementById('redoBtn');
  if (uBtn) uBtn.disabled = undoStack.length === 0;
  if (rBtn) rBtn.disabled = redoStack.length === 0;
}

function clearHistory() {
  undoStack = [];
  redoStack = [];
  pendingSnapshot = null;
  updateUndoRedoButtons();
}

function recordUndoPoint(snapStr = createSnapshot()) {
  if (undoStack.length > 0 && undoStack[undoStack.length - 1] === snapStr) return;
  undoStack.push(snapStr);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}

function restoreSnapshot(snapStr) {
  try {
    const data = JSON.parse(snapStr);
    if (data.camera) cameraCfg = data.camera;
    nodes = Array.isArray(data.nodes) ? data.nodes : [];
    nodes.forEach(n => {
      if (!Array.isArray(n.clips)) n.clips = [];
      if (!Array.isArray(n.tiles)) n.tiles = [];
      if (n.texture) preloadLocalImage(n.texture);
    });
    selectedIndex = Math.min(nodes.length - 1, data.selectedIndex ?? (nodes.length > 0 ? 0 : -1));
    if (selectedIndex < 0 || nodes[selectedIndex]?.nodeType !== 'TileMap') tileBrushMode = 'off';
    document.getElementById('modeBtn').textContent = cameraCfg.mode;
    autoSave();
    refreshAll();
    updateUndoRedoButtons();
  } catch (e) {}
}

function undo() {
  if (undoStack.length === 0) return;
  const currentSnap = createSnapshot();
  const prevSnap = undoStack.pop();
  redoStack.push(currentSnap);
  restoreSnapshot(prevSnap);
  showToast(`已撤销 (剩余 ${undoStack.length} 步)`);
}

function redo() {
  if (redoStack.length === 0) return;
  const currentSnap = createSnapshot();
  const nextSnap = redoStack.pop();
  undoStack.push(currentSnap);
  restoreSnapshot(nextSnap);
  showToast(`已重做 (剩余 ${redoStack.length} 步)`);
}

function showToast(msg) {
  const bar = document.getElementById('toastBar');
  bar.textContent = msg;
  bar.style.display = 'block';
  clearTimeout(bar._timer);
  bar._timer = setTimeout(() => { bar.style.display = 'none'; }, 2200);
}

function openNewMenuModal() { document.getElementById('newMenuModal').style.display = 'flex'; }
function closeNewMenuModal() { document.getElementById('newMenuModal').style.display = 'none'; }

function getSaveFolderPath() {
  if (window.ZeroBridge && window.ZeroBridge.getSaveLocation) {
    return window.ZeroBridge.getSaveLocation();
  }
  const curP = (window.ZeroBridge && window.ZeroBridge.getCurrentProject) ? window.ZeroBridge.getCurrentProject() : 'DefaultProject';
  return `/storage/emulated/0/Android/data/com.zero.engine/files/ZeroEngine/${curP}`;
}

function showSaveLocationModal() {
  document.getElementById('savePathText').textContent = getSaveFolderPath();
  document.getElementById('pathModal').style.display = 'flex';
}

function copySavePath() {
  const txt = document.getElementById('savePathText').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(txt);
  showToast("已复制存档文件夹路径");
}

function manualSave() {
  autoSave();
  const proj = (window.ZeroBridge && window.ZeroBridge.getCurrentProject) ? window.ZeroBridge.getCurrentProject() : 'Default';
  showToast(`💾 已保存: ${proj}/${currentScene}`);
}

function openInputModal(title, defaultVal, cb) {
  modalCallback = cb;
  document.getElementById('modalTitle').textContent = title;
  const inp = document.getElementById('modalInput');
  inp.value = defaultVal;
  document.getElementById('inputModal').style.display = 'flex';
  setTimeout(() => { inp.focus(); inp.select(); }, 50);
}

function closeInputModal() {
  document.getElementById('inputModal').style.display = 'none';
  modalCallback = null;
}

function confirmInputModal() {
  const val = document.getElementById('modalInput').value.trim();
  const cb = modalCallback;
  closeInputModal();
  if (val && cb) cb(val);
}

function defaultNodes() {
  return [
    {
      name: "GroundFloor", nodeType: "Sprite2D", layer: "World", parent: "", tag: "ground",
      x: 540, y: 960, z: -2, width: 2200, height: 2200, rotation: 0, tiltX: 0, billboard: false,
      scaleX: 1, scaleY: 1, zIndex: -10, texture: "", r: 0.16, g: 0.20, b: 0.28, a: 1,
      shadowCaster: false, collider: false, isTrigger: false, oneWay: false, hFrames: 1, vFrames: 1, currentFrame: 0, animFps: 12,
      defaultClip: "", clips: [], tiles: [], shader: "", script: ""
    },
    {
      name: "DungeonWalls", nodeType: "TileMap", layer: "World", parent: "", tag: "wall",
      x: 0, y: 0, z: 0, width: 90, height: 90, rotation: 0, tiltX: 0, billboard: false,
      scaleX: 1, scaleY: 1, zIndex: 0, texture: "", r: 0.36, g: 0.44, b: 0.56, a: 1,
      tileSize: 90,
      tiles: [
        { gx: 2, gy: 6, frame: 0 }, { gx: 3, gy: 6, frame: 0 }, { gx: 4, gy: 6, frame: 0 },
        { gx: 2, gy: 7, frame: 0 }, { gx: 2, gy: 8, frame: 0 }
      ],
      shadowCaster: false, collider: true, isTrigger: false, oneWay: false, hFrames: 1, vFrames: 1, currentFrame: 0, animFps: 12,
      defaultClip: "", clips: [], shader: "", script: ""
    },
    {
      name: "Hero", nodeType: "Sprite2D", layer: "World", parent: "", tag: "player",
      x: 540, y: 960, z: 0, width: 120, height: 150, rotation: 0, tiltX: 0, billboard: true,
      scaleX: 1, scaleY: 1, zIndex: 1, texture: "", r: 0.25, g: 0.82, b: 0.98, a: 1,
      shadowCaster: true, collider: true, isTrigger: false, oneWay: false, hFrames: 1, vFrames: 1, currentFrame: 0, animFps: 12,
      defaultClip: "idle",
      clips: [
        { name: "idle", start: 0, end: 0, fps: 8, loop: true },
        { name: "run", start: 0, end: 0, fps: 12, loop: true }
      ],
      tiles: [], shader: "",
      script: `var speed = 460;
function onReady() {
  Engine.setCameraMode("2.5D");
  Engine.setCameraTarget(self);
  self.play("idle");
}
function onProcess(dt) {
  if (Input.isTouching && Input.screenY < 1550) {
    var dx = Input.worldX - self.x;
    var dy = Input.worldY - self.y;
    var dist = Math.hypot(dx, dy);
    if (dist > 15) {
      self.vx = (dx / dist) * speed;
      self.vy = (dy / dist) * speed;
      self.scaleX = dx < 0 ? -1 : 1;
      self.play("run");
    } else {
      self.vx = 0; self.vy = 0;
      self.play("idle");
    }
  } else {
    self.vx = 0; self.vy = 0;
    self.play("idle");
  }
  Engine.moveAndSlide(self, dt);
}`
    }
  ];
}

let nodes = defaultNodes();

function resizeCanvas() {
  const box = document.getElementById('vpBox');
  canvas.width = box.clientWidth * window.devicePixelRatio;
  canvas.height = box.clientHeight * window.devicePixelRatio;
  draw();
}
window.addEventListener('resize', resizeCanvas);

window.onload = () => {
  resizeCanvas();
  if (window.ZeroBridge) {
    refreshProjectAndSceneLists();
    refreshAudioList();
    loadCurrentSceneFromDisk();
  }
  refreshAll();
  updateUndoRedoButtons();
};

function refreshAudioList() {
  if (!window.ZeroBridge || !window.ZeroBridge.listAudioFiles) return;
  try { audioAssets = JSON.parse(window.ZeroBridge.listAudioFiles()); } catch (e) { audioAssets = []; }
}

function refreshProjectAndSceneLists() {
  if (!window.ZeroBridge) return;
  const projs = JSON.parse(window.ZeroBridge.listProjects());
  const curP = window.ZeroBridge.getCurrentProject();
  document.getElementById('projSelect').innerHTML = projs.map(p => `<option value="${p}" ${p === curP ? 'selected' : ''}>工程:${p}</option>`).join('');
  const scenes = JSON.parse(window.ZeroBridge.listScenes());
  if (!scenes.includes(currentScene)) currentScene = scenes[0] || 'main.scene';
  document.getElementById('sceneSelect').innerHTML = scenes.map(s => `<option value="${s}" ${s === currentScene ? 'selected' : ''}>${s}</option>`).join('');
}

function loadCurrentSceneFromDisk() {
  if (!window.ZeroBridge) return;
  const raw = window.ZeroBridge.loadSceneFile(currentScene);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed.camera) cameraCfg = parsed.camera;
      nodes = Array.isArray(parsed.nodes) ? parsed.nodes : [];
      nodes.forEach(n => {
        if (!Array.isArray(n.clips)) n.clips = [];
        if (!Array.isArray(n.tiles)) n.tiles = [];
        if (n.texture) preloadLocalImage(n.texture);
      });
    } catch (e) { nodes = defaultNodes(); }
  } else {
    nodes = currentScene === 'main.scene' ? defaultNodes() : [];
    autoSave();
  }
  document.getElementById('modeBtn').textContent = cameraCfg.mode;
  selectedIndex = nodes.length > 0 ? 0 : -1;
  clearHistory();
}

function toggleCamMode() {
  recordUndoPoint();
  cameraCfg.mode = cameraCfg.mode === '2.5D' ? '2D' : '2.5D';
  document.getElementById('modeBtn').textContent = cameraCfg.mode;
  autoSave(); draw();
}

function openCreateProjectModal(withTemplate) {
  openInputModal(withTemplate ? "新建模板工程 (英文/数字)" : "新建空白工程 (英文/数字)", "MyGame_" + (Date.now() % 1000), (name) => {
    const safeName = name.replace(/[^a-zA-Z0-9_-]/g, '');
    if (!safeName) { showToast("请输入英文或数字名称"); return; }
    if (window.ZeroBridge) {
      if (window.ZeroBridge.createNewProject) window.ZeroBridge.createNewProject(safeName, withTemplate);
      else window.ZeroBridge.setProject(safeName);
    }
    currentScene = 'main.scene';
    nodes = withTemplate ? defaultNodes() : [];
    selectedIndex = nodes.length > 0 ? 0 : -1;
    clearHistory();
    autoSave();
    refreshProjectAndSceneLists();
    refreshAudioList();
    refreshAll();
    showToast(`已创建工程 ${safeName} (${withTemplate ? '含模板' : '空白'})`);
  });
}

function switchProject(name) {
  if (!window.ZeroBridge) return;
  window.ZeroBridge.setProject(name);
  currentScene = 'main.scene';
  refreshProjectAndSceneLists();
  refreshAudioList();
  loadCurrentSceneFromDisk();
  refreshAll();
  showToast("已切换工程: " + name);
}

function openCreateSceneModal() {
  openInputModal("新建场景文件 (英文/数字)", "level_" + (Date.now() % 100), (name) => {
    const safeName = name.replace(/[^a-zA-Z0-9._-]/g, '');
    if (!safeName) { showToast("请输入英文或数字文件名"); return; }
    currentScene = safeName.endsWith('.scene') ? safeName : safeName + '.scene';
    nodes = [];
    selectedIndex = -1;
    clearHistory();
    autoSave();
    refreshProjectAndSceneLists();
    refreshAll();
    showToast("已新建空白场景: " + currentScene);
  });
}

function switchScene(sceneName) {
  currentScene = sceneName;
  tileBrushMode = 'off';
  loadCurrentSceneFromDisk();
  refreshAll();
}

function toggleSnap() {
  snapGrid = !snapGrid;
  const btn = document.getElementById('snapBtn');
  btn.textContent = snapGrid ? '吸附' : '自由';
  btn.classList.toggle('active-toggle', snapGrid);
}

function resetView() { camX = 540; camY = 960; camZoom = 0.42; draw(); }

function exportBundle() {
  autoSave();
  if (window.ZeroBridge && window.ZeroBridge.exportProjectBundle) {

function paintTileAtWorld(wx, wy) {
  if (selectedIndex < 0 || !nodes[selectedIndex] || nodes[selectedIndex].nodeType !== 'TileMap') return;
  const n = nodes[selectedIndex];
  if (!Array.isArray(n.tiles)) n.tiles = [];
  const gt = getGlobalTransform(n);
  const ts = Math.max(8, n.tileSize || 90);
  const gx = Math.floor((wx - gt.gx) / ts);
  const gy = Math.floor((wy - gt.gy) / ts);
  const existIdx = n.tiles.findIndex(t => t.gx === gx && t.gy === gy);
  if (tileBrushMode === 'paint') {
    if (existIdx >= 0) n.tiles[existIdx].frame = brushFrame;
    else n.tiles.push({ gx, gy, frame: brushFrame });
  } else if (tileBrushMode === 'erase') {
    if (existIdx >= 0) n.tiles.splice(existIdx, 1);
  }
  draw();
}

function getGlobalTransform(n, visited = new Set()) {
  if (!n.parent || visited.has(n.name)) {
    return { gx: n.x, gy: n.y, gz: n.z || 0, gRot: n.rotation || 0, gSx: n.scaleX ?? 1, gSy: n.scaleY ?? 1 };
  }
  visited.add(n.name);
  const p = nodes.find(item => item.name === n.parent);
  if (!p) return { gx: n.x, gy: n.y, gz: n.z || 0, gRot: n.rotation || 0, gSx: n.scaleX ?? 1, gSy: n.scaleY ?? 1 };
  const pt = getGlobalTransform(p, visited);
  const rad = pt.gRot * Math.PI / 180;
  const sx = n.x * pt.gSx, sy = n.y * pt.gSy;
  return {
    gx: pt.gx + (sx * Math.cos(rad) - sy * Math.sin(rad)),
    gy: pt.gy + (sx * Math.sin(rad) + sy * Math.cos(rad)),
    gz: pt.gz + (n.z || 0),
    gRot: pt.gRot + (n.rotation || 0),
    gSx: pt.gSx * (n.scaleX ?? 1),
    gSy: pt.gSy * (n.scaleY ?? 1)
  };
}

function screenToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const sx = (clientX - rect.left) * (canvas.width / rect.width);
  const sy = (clientY - rect.top) * (canvas.height / rect.height);
  return { x: (sx - canvas.width / 2) / camZoom + camX, y: (sy - canvas.height / 2) / camZoom + camY };
}

function applySnap(v) { return snapGrid ? Math.round(v / GRID_SIZE) * GRID_SIZE : Math.round(v); }

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    dragMode = 'pinch';
    pendingSnapshot = null;
    lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    lastPanScreen = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
    return;
  }
  if (e.touches.length === 1) {
    const wp = screenToWorld(e.touches[0].clientX, e.touches[0].clientY);
    if (selectedIndex >= 0 && nodes[selectedIndex] && nodes[selectedIndex].nodeType === 'TileMap' && tileBrushMode !== 'off') {
      pendingSnapshot = createSnapshot();
      dragMode = 'tile_brush';
      paintTileAtWorld(wp.x, wp.y);
      return;
    }
    const gizmoLen = 110 / camZoom, hitR = 32 / camZoom;
    if (selectedIndex >= 0 && nodes[selectedIndex] && nodes[selectedIndex].nodeType !== 'TileMap') {
      const sel = nodes[selectedIndex], gt = getGlobalTransform(sel);
      if (Math.hypot(wp.x - (gt.gx + gizmoLen), wp.y - gt.gy) < hitR) { pendingSnapshot = createSnapshot(); dragMode = 'move_x'; dragStartWorld = wp; origNodeState = { ...sel }; return; }
      if (Math.hypot(wp.x - gt.gx, wp.y - (gt.gy + gizmoLen)) < hitR) { pendingSnapshot = createSnapshot(); dragMode = 'move_y'; dragStartWorld = wp; origNodeState = { ...sel }; return; }
      if (Math.hypot(wp.x - gt.gx, wp.y - (gt.gy - gizmoLen)) < hitR) { pendingSnapshot = createSnapshot(); dragMode = 'rotate'; dragStartWorld = wp; origNodeState = { ...sel }; return; }
    }
    let hit = -1;
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (n.nodeType === 'TileMap') continue;
      const gt = getGlobalTransform(n);
      if (Math.abs(wp.x - gt.gx) <= (n.width * gt.gSx) / 2 && Math.abs(wp.y - gt.gy) <= (n.height * gt.gSy) / 2) { hit = i; break; }
    }
    if (hit >= 0) {
      selectedIndex = hit;
      pendingSnapshot = createSnapshot();
      dragMode = 'move_xy'; dragStartWorld = wp; origNodeState = { ...nodes[hit] };
      refreshAll();
    } else {
      pendingSnapshot = null;
      dragMode = 'pan'; lastPanScreen = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragMode === 'pinch' && e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2, midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (lastPinchDist > 0) camZoom = Math.min(3, Math.max(0.15, camZoom * (dist / lastPinchDist)));
    const dpr = window.devicePixelRatio;
    camX -= (midX - lastPanScreen.x) * dpr / camZoom;
    camY -= (midY - lastPanScreen.y) * dpr / camZoom;
    lastPinchDist = dist; lastPanScreen = { x: midX, y: midY };
    draw(); return;
  }
  if (e.touches.length !== 1) return;
  if (dragMode === 'tile_brush') {
    const wp = screenToWorld(e.touches[0].clientX, e.touches[0].clientY);
    paintTileAtWorld(wp.x, wp.y);
    return;
  }
  if (dragMode === 'pan') {
    const dpr = window.devicePixelRatio;
    camX -= (e.touches[0].clientX - lastPanScreen.x) * dpr / camZoom;
    camY -= (e.touches[0].clientY - lastPanScreen.y) * dpr / camZoom;
    lastPanScreen = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    draw(); return;
  }
  if (selectedIndex < 0 || !origNodeState) return;
  const wp = screenToWorld(e.touches[0].clientX, e.touches[0].clientY);
  const n = nodes[selectedIndex], dx = wp.x - dragStartWorld.x, dy = wp.y - dragStartWorld.y;
  if (dragMode === 'move_xy') { n.x = applySnap(origNodeState.x + dx); n.y = applySnap(origNodeState.y + dy); }
  else if (dragMode === 'move_x') { n.x = applySnap(origNodeState.x + dx); }
  else if (dragMode === 'move_y') { n.y = applySnap(origNodeState.y + dy); }
  else if (dragMode === 'rotate') {
    const gt = getGlobalTransform(n);
    n.rotation = Math.round(Math.atan2(wp.y - gt.gy, wp.x - gt.gx) * 180 / Math.PI + 90);
  }
  if (activeTab === 'inspector') renderDock();
  draw();
}, { passive: false });

canvas.addEventListener('touchend', () => {
  if (pendingSnapshot && createSnapshot() !== pendingSnapshot) {
    recordUndoPoint(pendingSnapshot);
  }
  pendingSnapshot = null;
  if (dragMode === 'tile_brush') { autoSave(); if (activeTab === 'inspector') renderDock(); }
  else if (dragMode && dragMode !== 'pan' && dragMode !== 'pinch') autoSave();
  dragMode = null;
});

function rgbToHex(r, g, b) {
  const f = v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0');
  return `#${f(r)}${f(g)}${f(b)}`;
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: +(((n >> 16) & 255) / 255).toFixed(2), g: +(((n >> 8) & 255) / 255).toFixed(2), b: +((n & 255) / 255).toFixed(2) };
}

function draw() {
  const brushHint = (selectedIndex >= 0 && nodes[selectedIndex]?.nodeType === 'TileMap' && tileBrushMode !== 'off')
    ? ` | 🖌️${tileBrushMode === 'paint' ? '刷瓦片(#' + brushFrame + ')' : '橡皮擦'}` : '';
  document.getElementById('vpHud').textContent = `${cameraCfg.mode} | Zoom:${Math.round(camZoom * 100)}% | ${currentScene}${brushHint}`;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(camZoom, camZoom);
  ctx.translate(-camX, -camY);

  ctx.strokeStyle = '#151b26'; ctx.lineWidth = 2 / camZoom;
  for (let x = -1080; x <= 2160; x += 180) { ctx.beginPath(); ctx.moveTo(x, -1920); ctx.lineTo(x, 3840); ctx.stroke(); }
  for (let y = -1920; y <= 3840; y += 180) { ctx.beginPath(); ctx.moveTo(-1080, y); ctx.lineTo(2160, y); ctx.stroke(); }
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 4 / camZoom;
  ctx.strokeRect(0, 0, 1080, 1920);

  nodes.forEach((n, idx) => {
    const gt = getGlobalTransform(n);
    const w = n.width * gt.gSx, h = n.height * gt.gSy;
    ctx.save();
    ctx.translate(gt.gx, gt.gy);
    ctx.rotate(gt.gRot * Math.PI / 180);
    ctx.globalAlpha = n.a ?? 1;

    if (n.nodeType === 'TileMap') {
      const ts = Math.max(8, n.tileSize || 90);
      const img = (n.texture && imageCache[n.texture]) ? imageCache[n.texture] : null;
      const hf = Math.max(1, n.hFrames || 1), vf = Math.max(1, n.vFrames || 1);
      (n.tiles || []).forEach(cell => {
        const cx = cell.gx * ts, cy = cell.gy * ts;
        if (img) {
          const fi = Math.min(hf * vf - 1, Math.max(0, cell.frame || 0));
          const sw = img.width / hf, sh = img.height / vf;
          ctx.drawImage(img, (fi % hf) * sw, Math.floor(fi / hf) * sh, sw, sh, cx, cy, ts, ts);
        } else {
          ctx.fillStyle = rgbToHex(n.r, n.g, n.b);
          ctx.fillRect(cx, cy, ts, ts);
        }
        if (idx === selectedIndex) {
          ctx.strokeStyle = 'rgba(56,189,248,0.55)';
          ctx.lineWidth = 2 / camZoom;
          ctx.strokeRect(cx, cy, ts, ts);
        }
      });
    } else if (n.nodeType === 'PointLight') {
      const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, n.lightRadius || 300);
      grad.addColorStop(0, rgbToHex(n.r, n.g, n.b));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, n.lightRadius || 300, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(0, 0, 18 / camZoom, 0, Math.PI * 2); ctx.fill();
    } else if (n.nodeType === 'ParticleEmitter') {
      ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 3 / camZoom;
      ctx.beginPath(); ctx.arc(0, 0, 26 / camZoom, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = rgbToHex(n.r, n.g, n.b);
      ctx.beginPath(); ctx.arc(0, 0, 10 / camZoom, 0, Math.PI * 2); ctx.fill();
    } else if (n.nodeType === 'Label2D') {
      ctx.fillStyle = '#ffffff'; ctx.font = `bold ${n.fontSize || 44}px sans-serif`;
      ctx.fillText(n.text || 'Label', -w / 2, 10);
    } else if (n.texture && imageCache[n.texture]) {
      const img = imageCache[n.texture];
      const hf = Math.max(1, n.hFrames || 1), vf = Math.max(1, n.vFrames || 1);
      const fi = Math.min(hf * vf - 1, Math.max(0, n.currentFrame || 0));
      const sw = img.width / hf, sh = img.height / vf;
      ctx.drawImage(img, (fi % hf) * sw, Math.floor(fi / hf) * sh, sw, sh, -w / 2, -h / 2, w, h);
    } else {
      ctx.fillStyle = rgbToHex(n.r, n.g, n.b);
      ctx.fillRect(-w / 2, -h / 2, w, h);
    }

    if (n.nodeType !== 'TileMap') {
      if (n.layer === 'UI') {
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3 / camZoom;
        ctx.strokeRect(-w / 2, -h / 2, w, h);
      } else if (n.collider) {
        ctx.strokeStyle = n.isTrigger ? '#a855f7' : (n.oneWay ? '#34d399' : '#38bdf8');
        ctx.lineWidth = 3 / camZoom; ctx.setLineDash([10 / camZoom, 6 / camZoom]);
        ctx.strokeRect(-w / 2, -h / 2, w, h); ctx.setLineDash([]);
      }
    }
    ctx.restore();

    if (idx === selectedIndex && n.nodeType !== 'TileMap') {
      const len = 110 / camZoom, rHandle = 14 / camZoom;
      ctx.save(); ctx.translate(gt.gx, gt.gy);
      ctx.strokeStyle = '#ef4444'; ctx.fillStyle = '#ef4444'; ctx.lineWidth = 4 / camZoom;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(len, 0, rHandle, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#22c55e'; ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, len, rHandle, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fbbf24'; ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -len, rHandle, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  });
  ctx.restore();
}

function renderTree() {
  document.getElementById('treeList').innerHTML = nodes.map((n, i) => {
    const indent = n.parent ? '└ ' : '';
    const icon = n.nodeType === 'PointLight' ? '💡'
      : (n.nodeType === 'ParticleEmitter' ? '🔥'
      : (n.nodeType === 'TileMap' ? '🧱'
      : (n.layer === 'UI' ? '📱' : (n.billboard ? '🧍' : ''))));
    const badges = (n.script && n.script.trim() ? '📜' : '') + (n.shader && n.shader.trim() ? '✨' : '');
    return `<div class="tree-item ${i === selectedIndex ? 'active' : ''}" onclick="selectNode(${i})">${indent}${icon}${n.name} ${badges}</div>`;
  }).join('');
}

function selectNode(i) {
  selectedIndex = i;
  if (nodes[i]?.nodeType !== 'TileMap') tileBrushMode = 'off';
  refreshAll();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  renderDock();
}

function updateProp(key, val, isTyping = false) {
  if (selectedIndex < 0) return;
  if (isTyping) {
    if (!inputDebounceTimer) recordUndoPoint();
    clearTimeout(inputDebounceTimer);
    inputDebounceTimer = setTimeout(() => { inputDebounceTimer = null; }, 800);
  } else {
    recordUndoPoint();
  }
  if (key === 'name') {
    const oldName = nodes[selectedIndex].name;
    nodes.forEach(item => { if (item.parent === oldName) item.parent = val; });
  }
  nodes[selectedIndex][key] = val;
  if (key === 'texture' && val) preloadLocalImage(val);
  autoSave(); renderTree(); draw();
  if (key === 'texture' || key === 'hFrames' || key === 'vFrames') renderDock();
}

function updateColor(hex) {
  if (selectedIndex < 0) return;
  if (!inputDebounceTimer) recordUndoPoint();
  clearTimeout(inputDebounceTimer);
  inputDebounceTimer = setTimeout(() => { inputDebounceTimer = null; }, 600);
  const c = hexToRgb(hex);
  nodes[selectedIndex].r = c.r; nodes[selectedIndex].g = c.g; nodes[selectedIndex].b = c.b;
  autoSave(); draw();
}

function insertCode(id, snip) {
  const ta = document.getElementById(id);
  if (!ta) return;
  recordUndoPoint();
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.substring(0, s) + snip + ta.value.substring(e);
  ta.selectionStart = ta.selectionEnd = s + snip.length;
  ta.focus();
  nodes[selectedIndex][id === 'shaderEditor' ? 'shader' : 'script'] = ta.value;
  autoSave(); renderTree();
}

function refreshConsoleFromNative() { if (activeTab === 'console') renderDock(); }

function buildTilePaletteHtml(n) {
  if (!n.texture || !imageCache[n.texture]) {
    return `<div style="font-size:10px;color:#64748b;margin-top:5px;">未绑定图集时将使用纯色方块绘制；选中本节点后点左上角 <b>+图</b> 可直接导入并绑定图集。</div>`;
  }
  const img = imageCache[n.texture];
  const hf = Math.max(1, n.hFrames || 1);
  const vf = Math.max(1, n.vFrames || 1);
  const total = Math.min(64, hf * vf);
  let cells = '';
  for (let i = 0; i < total; i++) {
    const col = i % hf;
    const row = Math.floor(i / hf);
    const posX = hf > 1 ? (col / (hf - 1)) * 100 : 0;
    const posY = vf > 1 ? (row / (vf - 1)) * 100 : 0;
    cells += `<div class="palette-cell ${brushFrame === i ? 'selected' : ''}"
      style="background-image:url('${img.src}');background-size:${hf * 100}% ${vf * 100}%;background-position:${posX}% ${posY}%;"
      onclick="brushFrame=${i};tileBrushMode='paint';renderDock();draw();">
      <span class="palette-idx">${i}</span>
    </div>`;
  }
  return `<div class="palette-grid">${cells}</div>`;
}

function renderDock() {
  const body = document.getElementById('dockBody');
  if (activeTab === 'docs') {
    refreshAudioList();
    const audioStr = audioAssets.length ? audioAssets.join(', ') : '(暂无导入音频)';
    body.innerHTML = `<div class="doc-box">
<b>📂 当前工程 Save 文件夹位置：</b><br>
<span style="color:#34d399;">${getSaveFolderPath()}</span><br><br>
<b>📁 目录结构说明：</b><br>
• <b>scenes/</b>：存放所有 .scene 关卡文件（可用文本编辑器直接查看 JSON）<br>
• <b>textures/</b>：存放导入的 PNG/JPG 贴图与瓦片图集<br>
• <b>audio/</b>：已导入音频 (${audioStr})<br>
• <b>exports/</b>：点击「📦导出」生成的完整游戏发布包 (.zip)<br>
</div>`;
    return;
  }

  if (activeTab === 'console') {
    const logs = window.ZeroBridge ? window.ZeroBridge.getConsoleLogs() : 'Console ready.';
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:11px;color:#94a3b8;">Rhino JS 虚拟机与 OpenGL 着色器实时日志</span>
        <button style="padding:2px 6px;font-size:10px;" onclick="if(window.ZeroBridge)window.ZeroBridge.clearConsoleLogs();renderDock();">清空</button>
      </div>
      <pre id="consoleOut">${logs || '(暂无日志输出)'}</pre>`;
    return;
  }

  if (selectedIndex < 0 || !nodes[selectedIndex]) {
    body.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;margin-top:45px;">请在左侧节点树或视口中选择节点（或点上方 +精 / +瓦 创建）</div>';
    return;
  }

  const n = nodes[selectedIndex];
  if (activeTab === 'script') {
    body.innerHTML = `
      <div class="script-toolbar">
        <button onclick="insertCode('scriptEditor','Engine.tween(self, \\'scaleX\\', 1.25, 0.12, \\'easeOut\\')')">tween</button>
        <button onclick="insertCode('scriptEditor','self.flash(0.14)')">self.flash</button>
        <button onclick="insertCode('scriptEditor','self.emitBurst(25)')">emitBurst</button>
        <button onclick="insertCode('scriptEditor','self.play(\\'run\\')')">self.play</button>
        <button onclick="insertCode('scriptEditor','Engine.playSFX(\\'\\', 1.0)')">playSFX</button>
        <button onclick="insertCode('scriptEditor','function onCollision(other) {\\n  \\n}\\n')">+onCollision</button>
        <button onclick="insertCode('scriptEditor','function onTriggerEnter(other) {\\n  \\n}\\n')">+onTrigger</button>
      </div>
      <textarea id="scriptEditor" class="code-box" spellcheck="false" oninput="updateProp('script', this.value, true)">${n.script || ''}</textarea>`;
    return;
  }

  if (activeTab === 'shader') {
    const template = `precision mediump float;\nuniform sampler2D uTexture;\nuniform vec4 uColor;\nuniform float uTime;\nvarying vec2 vTexCoord;\nvoid main() {\n  vec4 c = texture2D(uTexture, vTexCoord) * uColor;\n  gl_FragColor = c;\n}`;
    body.innerHTML = `
      <div class="script-toolbar">
        <button onclick="updateProp('shader', \`${template}\`);renderDock();">载入自定义GLSL模板</button>
        <button onclick="updateProp('shader', '');renderDock();">恢复默认实时光照Shader</button>
      </div>
      <textarea id="shaderEditor" class="code-box" spellcheck="false" placeholder="留空则自动使用内置2.5D多光源Shader..." oninput="updateProp('shader', this.value, true)">${n.shader || ''}</textarea>`;
    return;
  }

  const parentOptions = [`<option value="">(根节点 Root)</option>`]
    .concat(nodes.filter((_, idx) => idx !== selectedIndex).map(p => `<option value="${p.name}" ${n.parent === p.name ? 'selected' : ''}>${p.name}</option>`))
    .join('');

  const texNames = Array.from(new Set([...Object.keys(imageCache), ...(n.texture ? [n.texture] : [])]));
  const texOptions = [`<option value="">(纯色方块)</option>`]
    .concat(texNames.map(t => `<option value="${t}" ${n.texture === t ? 'selected' : ''}>${t}</option>`))
    .join('');

  const clipsHtml = (n.clips || []).map((c, cIdx) => `
    <div class="clip-row">
      <input value="${c.name}" placeholder="名称" onchange="updateClip(${cIdx}, 'name', this.value)">
      <input type="number" min="0" value="${c.start}" title="起始帧" onchange="updateClip(${cIdx}, 'start', +this.value)">
      <input type="number" min="0" value="${c.end}" title="结束帧" onchange="updateClip(${cIdx}, 'end', +this.value)">
      <input type="number" min="1" value="${c.fps}" title="帧率FPS" onchange="updateClip(${cIdx}, 'fps', +this.value)">
      <label style="display:flex;align-items:center;gap:2px;color:#94a3b8;"><input type="checkbox" ${c.loop ? 'checked' : ''} onchange="updateClip(${cIdx}, 'loop', this.checked)">循环</label>
      <button class="danger" style="padding:2px 5px;font-size:10px;" onclick="deleteClip(${cIdx})">×</button>
    </div>
  `).join('');

  let extraFields = '';
  if (n.nodeType === 'TileMap') {
    extraFields = `
      <div class="field"><label>图集贴图 (Tileset)</label><select onchange="updateProp('texture', this.value)">${texOptions}</select></div>
      <div class="field"><label>瓦片尺寸 (TileSize)</label><input type="number" min="16" value="${n.tileSize || 90}" oninput="updateProp('tileSize', Math.max(16,+this.value), true)"></div>
      <div class="field"><label>图集列数 (H-Frames)</label><input type="number" min="1" value="${n.hFrames || 1}" onchange="updateProp('hFrames', Math.max(1,+this.value))"></div>
      <div class="field"><label>图集行数 (V-Frames)</label><input type="number" min="1" value="${n.vFrames || 1}" onchange="updateProp('vFrames', Math.max(1,+this.value))"></div>
      <div class="field"><label>纯色模式颜色</label><input type="color" value="${rgbToHex(n.r, n.g, n.b)}" oninput="updateColor(this.value)"></div>
      <div class="field"><label>当前画笔图块帧号</label><input type="number" min="0" value="${brushFrame}" oninput="brushFrame = Math.max(0,+this.value);draw();"></div>`;
  } else if (n.nodeType === 'PointLight') {
    extraFields = `
      <div class="field"><label>光照半径 (Radius)</label><input type="number" value="${n.lightRadius || 450}" oninput="updateProp('lightRadius', +this.value, true)"></div>
      <div class="field"><label>光照强度 (Intensity)</label><input type="number" step="0.1" value="${n.lightIntensity || 1.4}" oninput="updateProp('lightIntensity', +this.value, true)"></div>
      <div class="field"><label>灯光颜色</label><input type="color" value="${rgbToHex(n.r, n.g, n.b)}" oninput="updateColor(this.value)"></div>`;
  } else if (n.nodeType === 'ParticleEmitter') {
    extraFields = `
      <div class="field"><label>发射速率 (/秒)</label><input type="number" value="${n.emitRate ?? 24}" oninput="updateProp('emitRate', +this.value, true)"></div>
      <div class="field"><label>粒子寿命 (秒)</label><input type="number" step="0.1" value="${n.particleLife ?? 1.0}" oninput="updateProp('particleLife', +this.value, true)"></div>
      <div class="field"><label>初速度</label><input type="number" value="${n.particleSpeed ?? 150}" oninput="updateProp('particleSpeed', +this.value, true)"></div>
      <div class="field"><label>粒子大小</label><input type="number" value="${n.particleSize ?? 16}" oninput="updateProp('particleSize', +this.value, true)"></div>
      <div class="field"><label>重力加速度</label><input type="number" value="${n.particleGravity ?? -60}" oninput="updateProp('particleGravity', +this.value, true)"></div>
      <div class="field"><label>粒子颜色</label><input type="color" value="${rgbToHex(n.r, n.g, n.b)}" oninput="updateColor(this.value)"></div>`;
  } else {
    extraFields = `
      <div class="field"><label>贴图资源</label><select onchange="updateProp('texture', this.value)">${texOptions}</select></div>
      <div class="field"><label>混合颜色</label><input type="color" value="${rgbToHex(n.r, n.g, n.b)}" oninput="updateColor(this.value)"></div>
      <div class="field"><label>透明度 (0~1)</label><input type="number" step="0.1" value="${n.a ?? 1}" oninput="updateProp('a', +this.value, true)"></div>
      <div class="field"><label>序列帧列数 (H-Frames)</label><input type="number" min="1" value="${n.hFrames || 1}" onchange="updateProp('hFrames', Math.max(1,+this.value))"></div>
      <div class="field"><label>序列帧行数 (V-Frames)</label><input type="number" min="1" value="${n.vFrames || 1}" onchange="updateProp('vFrames', Math.max(1,+this.value))"></div>`;
  }

  const tileBrushBar = n.nodeType === 'TileMap' ? `
    <div class="clip-box" style="margin-bottom:8px;margin-top:0;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;">
        <span style="font-size:11px;font-weight:700;color:#38bdf8;">🧱 瓦片画笔 (${(n.tiles||[]).length} 格)</span>
        <div style="display:flex;gap:3px;">
          <button class="${tileBrushMode==='off'?'active-toggle':''}" style="padding:2px 5px;font-size:10px;" onclick="tileBrushMode='off';renderDock();draw();">拖动</button>
          <button class="${tileBrushMode==='paint'?'active-toggle':''}" style="padding:2px 5px;font-size:10px;" onclick="tileBrushMode='paint';renderDock();draw();">🖌️刷</button>
          <button class="${tileBrushMode==='erase'?'active-toggle':''}" style="padding:2px 5px;font-size:10px;" onclick="tileBrushMode='erase';renderDock();draw();">擦除</button>
          <button class="danger" style="padding:2px 5px;font-size:10px;" onclick="clearAllTiles()">清空</button>
        </div>
      </div>
      ${buildTilePaletteHtml(n)}
    </div>` : '';

  body.innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:7px;">
      <input style="background:#090c12;border:1px solid #334155;color:#fbbf24;font-weight:700;padding:4px 6px;border-radius:4px;font-size:12px;flex:1;" value="${n.name}" onchange="updateProp('name', this.value)">
      <button onclick="duplicateSelected()">复制</button>
      <button class="danger" onclick="deleteSelected()">删除</button>
    </div>
    ${tileBrushBar}
    <div class="grid">
      <div class="field"><label>渲染图层 (Layer)</label>
        <select onchange="updateProp('layer', this.value)">
          <option value="World" ${n.layer !== 'UI' ? 'selected' : ''}>World (2D/2.5D空间)</option>
          <option value="UI" ${n.layer === 'UI' ? 'selected' : ''}>UI (固定屏幕HUD层)</option>
        </select>
      </div>
      <div class="field"><label>父节点 (Hierarchy)</label><select onchange="updateProp('parent', this.value)">${parentOptions}</select></div>
      <div class="field"><label>局部 X</label><input type="number" value="${n.x}" oninput="updateProp('x', +this.value, true)"></div>
      <div class="field"><label>局部 Y</label><input type="number" value="${n.y}" oninput="updateProp('y', +this.value, true)"></div>
      <div class="field"><label>空间高度 Z</label><input type="number" value="${n.z || 0}" oninput="updateProp('z', +this.value, true)"></div>
      <div class="field"><label>节点标签 (Tag)</label><input value="${n.tag || 'default'}" onchange="updateProp('tag', this.value)"></div>
      <div class="field"><label>宽度</label><input type="number" value="${n.width}" oninput="updateProp('width', +this.value, true)"></div>
      <div class="field"><label>高度</label><input type="number" value="${n.height}" oninput="updateProp('height', +this.value, true)"></div>
      <div class="field"><label>Z轴旋转</label><input type="number" value="${n.rotation || 0}" oninput="updateProp('rotation', +this.value, true)"></div>
      <div class="field"><label>X轴倾角 (TiltX)</label><input type="number" value="${n.tiltX || 0}" oninput="updateProp('tiltX', +this.value, true)"></div>
      ${extraFields}
      <div class="field row"><input type="checkbox" ${n.billboard ? 'checked' : ''} onchange="updateProp('billboard', this.checked)"><label>HD-2D 立牌</label></div>
      <div class="field row"><input type="checkbox" ${n.shadowCaster ? 'checked' : ''} onchange="updateProp('shadowCaster', this.checked)"><label>投射阴影</label></div>
      <div class="field row"><input type="checkbox" ${n.collider ? 'checked' : ''} onchange="updateProp('collider', this.checked)"><label>开启碰撞体</label></div>
      <div class="field row"><input type="checkbox" ${n.isTrigger ? 'checked' : ''} onchange="updateProp('isTrigger', this.checked)"><label>触发器 (不阻挡)</label></div>
      <div class="field row"><input type="checkbox" ${n.oneWay ? 'checked' : ''} onchange="updateProp('oneWay', this.checked)"><label>单向平台 (可上穿)</label></div>
    </div>
    ${n.nodeType === 'Sprite2D' ? `
      <div class="clip-box">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:11px;font-weight:700;color:#38bdf8;">🎬 动画片段库 (名 / 起 / 止 / FPS)</span>
          <button style="padding:2px 6px;font-size:10px;" onclick="addClip()">+新增动画</button>
        </div>
        ${clipsHtml || '<div style="font-size:10px;color:#64748b;margin-top:4px;">暂无片段，点击右上角添加如 idle / run</div>'}
      </div>` : ''}`;
}

function refreshAll() { renderTree(); renderDock(); draw(); }
</script>
</body>
</html>
