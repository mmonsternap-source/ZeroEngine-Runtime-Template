<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZeroEngine Pro IDE v1.8</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>

<header>
  <div class="header-row">
    <button onclick="openNewMenuModal()">📄新建</button>
    <button class="save-btn" onclick="manualSave()">💾保存</button>
    <button onclick="showSaveLocationModal()">📂位置</button>
    <select class="proj-sel" id="projSelect" onchange="switchProject(this.value)"></select>
    <select class="proj-sel" id="sceneSelect" onchange="switchScene(this.value)"></select>
  </div>
  <div class="header-row">
    <button id="undoBtn" onclick="undo()" disabled>↩撤销</button>
    <button id="redoBtn" onclick="redo()" disabled>↪重做</button>
    <button id="modeBtn" class="active-toggle" onclick="toggleCamMode()">2.5D</button>
    <button id="snapBtn" class="active-toggle" onclick="toggleSnap()">吸附</button>
    <button onclick="resetView()">居中</button>
    <button class="export-btn" onclick="exportBundle()">📦导出</button>
    <button class="anim-btn" onclick="AnimStudio.open()">🎬动画</button>
    <button style="background:#4f46e5;border-color:#4338ca;color:#fff;" onclick="BlueprintStudio.open()">🧩蓝图</button>
    <button class="play" onclick="playScene()">▶ 运行</button>
  </div>
</header>

<div class="workspace">
  <div class="scene-tree">
    <div class="tree-header">
      <button onclick="addNode('Sprite2D')">+精</button>
      <button onclick="addNode('TileMap')">+瓦</button>
      <button onclick="addNode('ParticleEmitter')">+粒</button>
      <button onclick="pickNativeImage()">+图</button>
      <button onclick="pickNativeAudio()">+音</button>
      <button onclick="addNode('PointLight')">+光</button>
      <button onclick="addNode('Label2D')">+文</button>
      <button onclick="addUINode()">+UI</button>
    </div>
    <div class="tree-list" id="treeList"></div>
  </div>
  <div class="viewport" id="vpBox">
    <canvas id="stage"></canvas>
    <div class="vp-hud" id="vpHud">v1.8 | 2.5D</div>
  </div>
</div>

<div class="bottom-dock">
  <div class="tabs">
    <div class="tab active" id="tab-inspector" onclick="switchTab('inspector')">检查器</div>
    <div class="tab" id="tab-script" onclick="switchTab('script')">脚本/数据</div>
    <div class="tab" id="tab-shader" onclick="switchTab('shader')">着色器</div>
    <div class="tab" id="tab-console" onclick="switchTab('console')">控制台</div>
    <div class="tab" id="tab-docs" onclick="switchTab('docs')">工程/API</div>
  </div>
  <div class="dock-body" id="dockBody"></div>
</div>

<!-- 新建菜单弹窗 -->
<div class="modal-mask" id="newMenuModal">
  <div class="modal-card">
    <div class="modal-title">📄 新建 (New)</div>
    <div style="font-size:11px;color:#94a3b8;">当前保存目录：<span id="newModalPathHint" style="color:#34d399;"></span></div>
    <button style="padding:8px;text-align:left;" onclick="chooseSaveFolderNative()">📂 更改工程保存文件夹 (选择手机目录)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateScriptModal()">📜 在当前工程新建外部 JS 模块 (scripts/*.js)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateDataModal()">📊 在当前工程新建数据表/多语言 (data/*.json)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateSceneModal()">🗺️ 在当前工程新建关卡场景 (.scene)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateProjectModal('empty')">🆕 新建空白游戏工程 (全品类自由发挥)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateProjectModal('rpg25d')">🎮 新建 2.5D 俯视角探索模板 (HD-2D RPG)</button>
    <button style="padding:8px;text-align:left;" onclick="closeNewMenuModal();openCreateProjectModal('platformer')">⚔️ 新建 2D 横版动作模板 (斜坡/下劈/钩爪/存档)</button>
    <div class="modal-actions">
      <button onclick="closeNewMenuModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 名称输入弹窗 -->
<div class="modal-mask" id="inputModal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">新建</div>
    <input class="modal-input" id="modalInput" type="text" placeholder="请输入名称 (支持中文/英文/数字)...">
    <div class="modal-actions">
      <button onclick="closeInputModal()">取消</button>
      <button class="play" style="margin-left:0;" onclick="confirmInputModal()">确定创建</button>
    </div>
  </div>
</div>

<!-- 存档文件夹位置弹窗 -->
<div class="modal-mask" id="pathModal">
  <div class="modal-card">
    <div class="modal-title" id="pathModalTitle">📂 选择 Save Project 文件夹位置</div>
    <div style="font-size:11px;color:#94a3b8;">当前工程保存位置（可随时点击下方按钮选择手机里的任意文件夹，如 Documents）：</div>
    <div class="path-box" id="savePathText">/storage/emulated/0/Android/data/com.zero.engine/files/ZeroEngine/projects/DefaultProject</div>
    <button class="save-btn" style="padding:8px;text-align:center;" onclick="chooseSaveFolderNative()">📂 选择手机文件夹 (自定义保存位置)</button>
    <div class="modal-actions">
      <button onclick="resetDefaultFolder()">恢复默认</button>
      <button onclick="copySavePath()">复制路径</button>
      <button class="play" style="margin-left:0;" onclick="document.getElementById('pathModal').style.display='none'">确定进入</button>
    </div>
  </div>
</div>

<div class="toast-bar" id="toastBar"></div>

<script src="editor_templates.js"></script>
<script src="editor_core.js"></script>
<script src="editor_viewport.js"></script>
<script src="editor_dock.js"></script>
<script src="anim_studio.js"></script>
<script src="blueprint_studio.js"></script>
</body>
</html>
