<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZeroEngine 通用引擎</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
  body { background: #12141a; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { background: #1a1d26; padding: 8px 10px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #2d3343; }
  header h1 { font-size: 13px; color: #34d399; margin-right: auto; font-weight: 800; }
  button, select.top-select { background: #2b3142; color: #fff; border: 1px solid #3f475e; padding: 6px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  button.play { background: #10b981; border-color: #059669; color: #042f2e; font-weight: 800; }
  button.danger { background: #ef4444; border-color: #dc2626; }
  .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #0b0d11; overflow: hidden; touch-action: none; }
  canvas { background: #14171f; border: 2px solid #334155; max-width: 94%; max-height: 94%; }
  .inspector { background: #1a1d26; border-top: 1px solid #2d3343; padding: 10px; height: 245px; overflow-y: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #94a3b8; }
  .field input, .field select { background: #0f1117; border: 1px solid #334155; color: #fff; padding: 5px; border-radius: 4px; font-size: 12px; width: 100%; }
  .field.row { flex-direction: row; align-items: center; gap: 6px; padding-top: 14px; }
</style>
</head>
<body>

<header>
  <h1>ZeroEngine</h1>
  <select class="top-select" onchange="loadTemplate(this.value); this.value='';">
    <option value="">模板...</option>
    <option value="platformer">横版跳跃闯关</option>
    <option value="shooter">竖屏弹幕射击</option>
    <option value="virus">病毒感染扩散</option>
  </select>
  <button onclick="addRectNode()">+ 方块</button>
  <button onclick="pickNativeImage()">+ PNG</button>
  <button class="play" onclick="playScene()">▶ 运行</button>
</header>

<div class="canvas-area">
  <canvas id="stage" width="1080" height="1920"></canvas>
</div>

<div class="inspector" id="inspector"></div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const imageCache = {};

let nodes = [
  { name: "Player", x: 540, y: 1200, width: 110, height: 110, rotation: 0, texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: true, behavior: "platformer", tag: "player" },
  { name: "Ground", x: 540, y: 1550, width: 900, height: 80, rotation: 0, texture: "", r: 0.35, g: 0.45, b: 0.65, a: 1, collider: true, behavior: "none", tag: "wall" },
  { name: "Platform", x: 680, y: 1150, width: 360, height: 60, rotation: 0, texture: "", r: 0.35, g: 0.45, b: 0.65, a: 1, collider: true, behavior: "none", tag: "wall" },
  { name: "Coin_1", x: 680, y: 1020, width: 70, height: 70, rotation: 0, texture: "", r: 0.98, g: 0.8, b: 0.1, a: 1, collider: true, behavior: "coin", tag: "coin" }
];
let selectedIndex = 0;
let dragging = false, dragOffsetX = 0, dragOffsetY = 0;

function loadTemplate(type) {
  if (!type) return;
  if (type === 'platformer') {
    nodes = [
      { name: "Hero", x: 260, y: 1300, width: 110, height: 110, rotation: 0, texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: true, behavior: "platformer", tag: "player" },
      { name: "Floor", x: 540, y: 1550, width: 960, height: 80, rotation: 0, texture: "", r: 0.35, g: 0.45, b: 0.65, a: 1, collider: true, behavior: "none", tag: "wall" },
      { name: "Step1", x: 700, y: 1220, width: 340, height: 60, rotation: 0, texture: "", r: 0.35, g: 0.45, b: 0.65, a: 1, collider: true, behavior: "none", tag: "wall" },
      { name: "Enemy", x: 540, y: 1450, width: 90, height: 90, rotation: 0, texture: "", r: 0.95, g: 0.25, b: 0.25, a: 1, collider: true, behavior: "patrol", tag: "enemy" },
      { name: "Gold", x: 700, y: 1100, width: 70, height: 70, rotation: 0, texture: "", r: 0.98, g: 0.8, b: 0.1, a: 1, collider: true, behavior: "coin", tag: "coin" }
    ];
  } else if (type === 'shooter') {
    nodes = [
      { name: "Fighter", x: 540, y: 1550, width: 120, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.8, b: 0.95, a: 1, collider: true, behavior: "shooter", tag: "player" },
      { name: "Boss1", x: 300, y: 420, width: 130, height: 130, rotation: 0, texture: "", r: 0.95, g: 0.3, b: 0.3, a: 1, collider: true, behavior: "patrol", tag: "enemy" },
      { name: "Boss2", x: 760, y: 650, width: 130, height: 130, rotation: 0, texture: "", r: 0.95, g: 0.45, b: 0.2, a: 1, collider: true, behavior: "patrol", tag: "enemy" }
    ];
  } else if (type === 'virus') {
    nodes = [
      { name: "Cell_1", x: 320, y: 600, width: 120, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: false, behavior: "virus", tag: "cell" },
      { name: "Cell_2", x: 640, y: 680, width: 120, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: false, behavior: "virus", tag: "cell" },
      { name: "Cell_3", x: 480, y: 980, width: 120, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: false, behavior: "virus", tag: "cell" },
      { name: "Cell_4", x: 760, y: 1220, width: 120, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: false, behavior: "virus", tag: "cell" },
      { name: "Cell_5", x: 300, y: 1300, width: 120, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.85, b: 0.6, a: 1, collider: false, behavior: "virus", tag: "cell" }
    ];
  }
  selectedIndex = 0;
  autoSave();
  renderInspector();
  draw();
}

window.onload = () => {
  if (window.ZeroBridge) {
    const saved = window.ZeroBridge.loadSavedScene();
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed.nodes) && parsed.nodes.length > 0) {
          nodes = parsed.nodes;
          nodes.forEach(n => { if (n.texture) preloadLocalImage(n.texture); });
        }
      } catch (e) {}
    }
  }
  renderInspector();
  draw();
};

function preloadLocalImage(fileName) {
  if (!window.ZeroBridge || imageCache[fileName]) return;
  const dataUrl = window.ZeroBridge.getTextureBase64(fileName);
  if (dataUrl) {
    const img = new Image();
    img.onload = () => { imageCache[fileName] = img; draw(); };
    img.src = dataUrl;
  }
}

function pickNativeImage() {
  if (window.ZeroBridge) window.ZeroBridge.pickImage();
}

function onNativeImagePicked(fileName, dataUrl, w, h) {
  const img = new Image();
  img.onload = () => {
    imageCache[fileName] = img;
    nodes.push({
      name: fileName.replace(/\.[^.]+$/, ''),
      x: 540, y: 960,
      width: w || img.width || 160,
      height: h || img.height || 160,
      rotation: 0, texture: fileName,
      r: 1, g: 1, b: 1, a: 1,
      collider: true, behavior: "none", tag: "prop"
    });
    selectedIndex = nodes.length - 1;
    autoSave();
    renderInspector();
    draw();
  };
  img.src = dataUrl;
}

function autoSave() {
  if (window.ZeroBridge) window.ZeroBridge.saveScene(JSON.stringify({ nodes }));
}

function playScene() {
  if (window.ZeroBridge) window.ZeroBridge.runGame(JSON.stringify({ nodes }));
}

function rgbToHex(r, g, b) {
  const toHex = v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: +(((n >> 16) & 255) / 255).toFixed(2), g: +(((n >> 8) & 255) / 255).toFixed(2), b: +((n & 255) / 255).toFixed(2) };
}

function addRectNode() {
  nodes.push({ name: `Obj_${nodes.length + 1}`, x: 540, y: 960, width: 160, height: 120, rotation: 0, texture: "", r: 0.2, g: 0.8, b: 0.6, a: 1, collider: true, behavior: "none", tag: "wall" });
  selectedIndex = nodes.length - 1;
  autoSave();
  renderInspector();
  draw();
}

function duplicateSelected() {
  if (selectedIndex < 0) return;
  const copy = JSON.parse(JSON.stringify(nodes[selectedIndex]));
  copy.name += "_copy";
  copy.x += 60;
  copy.y += 60;
  nodes.push(copy);
  selectedIndex = nodes.length - 1;
  autoSave();
  renderInspector();
  draw();
}

function deleteSelected() {
  if (selectedIndex < 0) return;
  nodes.splice(selectedIndex, 1);
  selectedIndex = nodes.length - 1;
  autoSave();
  renderInspector();
  draw();
}

function getCanvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

function handleDown(clientX, clientY) {
  const pos = getCanvasPos(clientX, clientY);
  selectedIndex = -1;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (Math.abs(pos.x - n.x) <= n.width / 2 && Math.abs(pos.y - n.y) <= n.height / 2) {
      selectedIndex = i;
      dragging = true;
      dragOffsetX = pos.x - n.x;
      dragOffsetY = pos.y - n.y;
      break;
    }
  }
  renderInspector();
  draw();
}

function handleMove(clientX, clientY) {
  if (!dragging || selectedIndex < 0) return;
  const pos = getCanvasPos(clientX, clientY);
  nodes[selectedIndex].x = Math.round(pos.x - dragOffsetX);
  nodes[selectedIndex].y = Math.round(pos.y - dragOffsetY);
  renderInspector();
  draw();
}

function handleUp() {
  if (dragging) { dragging = false; autoSave(); }
}

canvas.addEventListener('touchstart', e => { if (e.touches.length) handleDown(e.touches[0].clientX, e.touches[0].clientY); });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length) handleMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
canvas.addEventListener('touchend', handleUp);
canvas.addEventListener('mousedown', e => handleDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
window.addEventListener('mouseup', handleUp);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#1e222d';
  ctx.lineWidth = 2;
  for (let x = 0; x <= 1080; x += 180) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1920); ctx.stroke(); }
  for (let y = 0; y <= 1920; y += 180) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1080, y); ctx.stroke(); }

  nodes.forEach((n, idx) => {
    ctx.save();
    ctx.translate(n.x, n.y);
    ctx.rotate((n.rotation || 0) * Math.PI / 180);
    ctx.globalAlpha = n.a ?? 1;

    if (n.texture && imageCache[n.texture]) {
      ctx.drawImage(imageCache[n.texture], -n.width / 2, -n.height / 2, n.width, n.height);
    } else {
      ctx.fillStyle = rgbToHex(n.r, n.g, n.b);
      ctx.fillRect(-n.width / 2, -n.height / 2, n.width, n.height);
    }

    if (n.collider) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.setLineDash([12, 8]);
      ctx.strokeRect(-n.width / 2, -n.height / 2, n.width, n.height);
      ctx.setLineDash([]);
    }

    if (idx === selectedIndex) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 6;
      ctx.strokeRect(-n.width / 2 - 4, -n.height / 2 - 4, n.width + 8, n.height + 8);
    }
    ctx.restore();
  });
}

function updateProp(key, val) {
  if (selectedIndex < 0) return;
  nodes[selectedIndex][key] = val;
  autoSave();
  draw();
}

function updateColor(hex) {
  if (selectedIndex < 0) return;
  const c = hexToRgb(hex);
  nodes[selectedIndex].r = c.r;
  nodes[selectedIndex].g = c.g;
  nodes[selectedIndex].b = c.b;
  autoSave();
  draw();
}

function renderInspector() {
  const box = document.getElementById('inspector');
  if (selectedIndex < 0 || !nodes[selectedIndex]) {
    box.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;margin-top:40px;">点顶部“模板...”切换游戏类型，或点击画布编辑物体</div>';
    return;
  }
  const n = nodes[selectedIndex];
  const b = n.behavior || 'none';
  box.innerHTML = `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
      <strong style="font-size:13px;color:#fbbf24;margin-right:auto;">${n.name}</strong>
      <button onclick="duplicateSelected()">复制</button>
      <button class="danger" onclick="deleteSelected()">删除</button>
    </div>
    <div class="grid">
      <div class="field"><label>行为模式 (Gameplay)</label>
        <select onchange="updateProp('behavior', this.value)">
          <option value="none" ${b==='none'?'selected':''}>静态物体 / 墙壁</option>
          <option value="drag" ${b==='drag'?'selected':''}>主角: 手指拖拽移动</option>
          <option value="platformer" ${b==='platformer'?'selected':''}>主角: 横版重力跳跃</option>
          <option value="shooter" ${b==='shooter'?'selected':''}>主角: 拖动+自动射击</option>
          <option value="patrol" ${b==='patrol'?'selected':''}>敌人: 左右自动巡逻</option>
          <option value="coin" ${b==='coin'?'selected':''}>道具: 收集加分</option>
          <option value="virus" ${b==='virus'?'selected':''}>细胞: 点击感染扩散</option>
        </select>
      </div>
      <div class="field"><label>颜色 (色块)</label><input type="color" value="${rgbToHex(n.r, n.g, n.b)}" oninput="updateColor(this.value)"></div>
      <div class="field"><label>X 坐标</label><input type="number" value="${n.x}" oninput="updateProp('x', +this.value)"></div>
      <div class="field"><label>Y 坐标</label><input type="number" value="${n.y}" oninput="updateProp('y', +this.value)"></div>
      <div class="field"><label>宽度</label><input type="number" value="${n.width}" oninput="updateProp('width', +this.value)"></div>
      <div class="field"><label>高度</label><input type="number" value="${n.height}" oninput="updateProp('height', +this.value)"></div>
      <div class="field"><label>旋转</label><input type="number" value="${n.rotation || 0}" oninput="updateProp('rotation', +this.value)"></div>
      <div class="field row"><input type="checkbox" ${n.collider ? 'checked' : ''} onchange="updateProp('collider', this.checked)"><label>开启碰撞体</label></div>
    </div>
  `;
}
</script>
</body>
</html>
